<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roleta Nostálgicas Personalizados</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --vintage-gold: #d4a373;
            --vintage-cream: #faedcd;
            --vintage-brown: #463f3a;
            --accent: #bc6c25;
        }

        body {
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: var(--vintage-cream);
            color: var(--vintage-brown);
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .container { max-width: 400px; width: 100%; }

        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 40px auto;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid var(--vintage-brown);
            transition: transform 5s cubic-bezier(0.15, 0, 0.15, 1);
        }

        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #e63946;
            z-index: 100;
        }

        .btn-spin {
            background: var(--accent);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 0 #8a4a16;
        }

        .btn-spin:active { transform: translateY(2px); box-shadow: 0 2px 0 #8a4a16; }
        .btn-spin:disabled { background: #ccc; box-shadow: none; }

        #result {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background: white;
            border-radius: 15px;
            border: 2px dashed var(--vintage-gold);
        }

        .whatsapp-link {
            display: inline-block;
            margin-top: 15px;
            background: #25d366;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Nostálgicas Personalizados</h2>
    <p>Obrigado pela sua compra! Gire para ganhar seu presente acumulativo:</p>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="500" height="500"></canvas>
    </div>

    <button class="btn-spin" id="spinBtn" onclick="spin()">GIRAR AGORA</button>

    <div id="result">
        <h3 id="prizeTitle"></h3>
        <p id="prizeDesc"></p>
        <a id="waLink" href="#" class="whatsapp-link" target="_blank">Resgatar via WhatsApp</a>
    </div>
</div>

<script>
    const prizes = [
        { name: "Cupom Indicação", desc: "10% para você e 10% para seu indicado!" },
        { name: "15% OFF", desc: "Desconto especial para sua próxima compra." },
        { name: "Mini Álbum", desc: "Ganhou um Chuveirinho com 10 fotos no próximo pedido!" },
        { name: "R$ 10 OFF", desc: "R$ 10 de desconto garantido na próxima compra." },
        { name: "Frete Grátis", desc: "Sua próxima entrega é por nossa conta!" }
    ];

    const colors = ["#d4a373", "#ccd5ae", "#e9edc9", "#fefae0", "#faedcd"];
    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    let currentRotation = 0;

    function draw() {
        const arc = (2 * Math.PI) / prizes.length;
        for (let i = 0; i < prizes.length; i++) {
            ctx.beginPath();
            ctx.fillStyle = colors[i];
            ctx.moveTo(250, 250);
            ctx.arc(250, 250, 250, i * arc, (i + 1) * arc);
            ctx.fill();
            ctx.stroke();

            // Texto das fatias
            ctx.save();
            ctx.translate(250, 250);
            ctx.rotate(i * arc + arc / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = "#463f3a";
            ctx.font = "bold 24px Georgia";
            ctx.fillText(prizes[i].name, 230, 10);
            ctx.restore();
        }
    }

    function spin() {
        const btn = document.getElementById("spinBtn");
        btn.disabled = true;

        const rounds = Math.floor(Math.random() * 5) + 10; 
        const extraDegrees = Math.floor(Math.random() * 360);
        currentRotation += (rounds * 360) + extraDegrees;
        
        canvas.style.transform = `rotate(${currentRotation}deg)`;

        setTimeout(() => {
            const actualDeg = currentRotation % 360;
            const prizeIndex = Math.floor((360 - actualDeg) / (360 / prizes.length)) % prizes.length;
            const won = prizes[prizeIndex];
            
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            
            document.getElementById("result").style.display = "block";
            document.getElementById("prizeTitle").innerText = "Parabéns!";
            document.getElementById("prizeDesc").innerText = won.name + ": " + won.desc;
            
            const waMsg = encodeURIComponent(`Olá! Ganhei o prêmio: [${won.name}] na Roleta Nostálgicas! Por favor, deixe salvo para meu próximo pedido.`);
            document.getElementById("waLink").href = `https://wa.me/55SEUNUMERO?text=${waMsg}`; // COLOQUE SEU NUMERO AQUI
        }, 5000);
    }

    draw();
</script>

</body>
</html>
