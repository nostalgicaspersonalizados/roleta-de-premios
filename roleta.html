<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roleta Nostálgicas Personalizados</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --vintage-gold: #d4a373;
            --vintage-cream: #faedcd;
            --vintage-brown: #463f3a;
            --accent: #bc6c25;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: var(--vintage-cream);
            color: var(--vintage-brown);
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .container { max-width: 400px; width: 100%; }

        h2 { margin-bottom: 5px; color: var(--accent); }

        .wheel-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 30px auto;
        }

        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid var(--vintage-brown);
            background-color: white;
            transition: transform 5s cubic-bezier(0.15, 0, 0.15, 1);
        }

        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 35px solid #e63946;
            z-index: 100;
        }

        .btn-spin {
            background: var(--accent);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 0 #8a4a16;
            margin-top: 20px;
        }

        #result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            background: white;
            border-radius: 15px;
            border: 3px solid var(--vintage-gold);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .whatsapp-link {
            display: inline-block;
            margin-top: 15px;
            background: #25d366;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Nostálgicas Personalizados</h2>
    <p>Gire para ganhar um presente para seu próximo pedido!</p>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="500" height="500"></canvas>
    </div>

    <button class="btn-spin" id="spinBtn" onclick="spin()">GIRAR ROLETA</button>

    <div id="result">
        <h3 id="prizeTitle" style="margin:0; color: var(--accent);"></h3>
        <p id="prizeDesc" style="font-size: 1.1rem; margin: 10px 0;"></p>
        <a id="waLink" href="#" class="whatsapp-link" target="_blank">Resgatar via WhatsApp</a>
    </div>
</div>

<script>
    const prizes = [
        "Cupom Indicação",
        "15% de Desconto",
        "Mini Álbum 10 fotos",
        "R$ 10 OFF",
        "Frete Grátis"
    ];

    const colors = ["#d4a373", "#ccd5ae", "#e9edc9", "#fefae0", "#faedcd"];
    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    let currentRotation = 0;

    function drawWheel() {
        const arc = (2 * Math.PI) / prizes.length;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        for (let i = 0; i < prizes.length; i++) {
            ctx.save();
            ctx.beginPath();
            ctx.fillStyle = colors[i];
            ctx.moveTo(250, 250);
            ctx.arc(250, 250, 250, i * arc, (i + 1) * arc);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "#463f3a";
            ctx.stroke();

            // Texto
            ctx.translate(250, 250);
            ctx.rotate(i * arc + arc / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = "#463f3a";
            ctx.font = "bold 22px Arial";
            ctx.fillText(prizes[i], 230, 10);
            ctx.restore();
        }
    }

    function spin() {
        const btn = document.getElementById("spinBtn");
        btn.disabled = true;

        const extraDegrees = Math.floor(Math.random() * 360) + 2880; // 8 voltas + aleatório
        currentRotation += extraDegrees;
        
        canvas.style.transform = `rotate(${currentRotation}deg)`;

        setTimeout(() => {
            const actualDeg = currentRotation % 360;
            // Ajuste do cálculo para bater com o ponteiro no topo (270 graus)
            const prizeIndex = Math.floor(((360 - actualDeg + 270) % 360) / (360 / prizes.length));
            const won = prizes[prizeIndex];
            
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            
            document.getElementById("result").style.display = "block";
            document.getElementById("prizeTitle").innerText = "PARABÉNS!";
            document.getElementById("prizeDesc").innerText = "Você ganhou: " + won;
            
            const waMsg = encodeURIComponent(`Olá! Ganhei o prêmio: [${won}] na Roleta Nostálgicas! Deixe salvo para meu próximo pedido.`);
            document.getElementById("waLink").href = `https://wa.me/5591984711618?text=${waMsg}`;
            
            btn.innerText = "SORTEADO!";
        }, 5100);
    }

    // Garante que desenha ao carregar
    window.onload = drawWheel;
</script>

</body>
</html>
