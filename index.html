<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roleta VIP - Nostálgicas</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --azul-escuro: #300870;
            --branco: #fefefe;
            --amarelo: #faea60;
            --dourado: #ffb11b;
            --roxo-logo: #8c52ff;
        }

        body { 
            background: url('fundotema.png') no-repeat center center fixed; 
            background-size: cover;
            text-align: center; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh;
        }

        .box { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); 
            max-width: 400px; width: 88%; padding: 30px 20px; border-radius: 40px; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.4); 
        }

        .logo-container img { max-width: 160px; height: auto; margin-bottom: 5px; }
        
        /* Subtítulo com a nova fonte e frase */
        .subtitle { 
            font-family: 'Dancing Script', cursive;
            font-size: 22px; 
            color: var(--roxo-logo); 
            margin-bottom: 20px;
            font-weight: 700;
        }
        
        label { display: block; text-align: left; margin: 10px 0 3px 25px; font-weight: 700; font-size: 10px; color: var(--azul-escuro); text-transform: uppercase; }
        
        input[type="text"] { 
            padding: 12px; width: 88%; border: 2px solid rgba(0,0,0,0.05); border-radius: 15px; 
            font-size: 14px; margin-bottom: 5px; outline: none; box-sizing: border-box; background: rgba(255,255,255,0.9);
        }

        .lgpd-container { display: flex; align-items: flex-start; justify-content: center; margin: 15px 20px; gap: 8px; text-align: left; }
        .lgpd-container input { margin-top: 3px; }
        .lgpd-container label { margin: 0; font-size: 9px; color: #555; text-transform: none; line-height: 1.3; }

        .btn-main { 
            padding: 18px; width: 90%; font-size: 16px; font-weight: 900; 
            background: linear-gradient(135deg, var(--roxo-logo), #6a32cc); 
            color: white; border: none; border-radius: 20px; cursor: pointer; margin-top: 10px;
            text-transform: uppercase;
        }

        .canvas-wrap { position: relative; width: 270px; height: 270px; margin: 15px auto; }
        #canvas { width: 100%; height: 100%; border-radius: 50%; border: 8px solid var(--azul-escuro); transition: transform 5s cubic-bezier(0.1, 0, 0.2, 1); background: #fff; }
        .pointer { width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid var(--dourado); position: absolute; top: -15px; left: 50%; transform: translateX(-50%); z-index: 10; }
        
        #result { display: none; margin-top: 15px; border-top: 3px solid var(--amarelo); padding-top: 15px; }
        .wa-btn { display: inline-block; margin-top: 10px; padding: 18px; background: #25d366; color: white; text-decoration: none; border-radius: 20px; font-weight: 900; width: 85%; text-transform: uppercase; font-size: 13px; }
        
        #campoIndicado { display: none; margin-top: 10px; border: 1px dashed var(--roxo-logo); padding: 15px; border-radius: 15px; background: rgba(140,82,255,0.05); }
    </style>
</head>
<body>

<div class="box">
    <div class="logo-container">
        <img src="NOSTÁLGICAS (1).png" alt="Logo Nostálgicas">
    </div>
    <p class="subtitle">Arte, Lembranças e amor</p>

    <div id="formInicial">
        <label>COMO PODEMOS TE CHAMAR?</label>
        <input type="text" id="nomeCliente" placeholder="Seu nome">

        <label>NÚMERO DO PEDIDO (Superior do recibo):</label>
        <input type="text" id="numPedido" placeholder="Digite o número...">
        
        <label>PRÓXIMO DESEJO:</label>
        <input type="text" id="proximoDesejo" placeholder="O que quer adquirir depois?">

        <div class="lgpd-container">
            <input type="checkbox" id="checkLGPD">
            <label for="checkLGPD">Autorizo o uso dos meus dados pela Nostálgicas para fins de sorteio e contato, conforme a LGPD.</label>
        </div>
        <button class="btn-main" onclick="validarForm()">LIBERAR MEU GIRO</button>
    </div>
    
    <div id="areaRoleta" style="display:none;">
        <div class="canvas-wrap">
            <div class="pointer"></div>
            <canvas id="canvas" width="500" height="500"></canvas>
        </div>
        <button id="spinBtn" class="btn-main" onclick="girar()">GIRAR AGORA!</button>
    </div>

    <div id="result">
        <h3 id="prizeText" style="color: var(--roxo-logo); font-size: 20px; margin: 5px 0;"></h3>
        <p id="prizeInfo" style="font-size: 14px; color: #444; margin-bottom: 10px; font-weight: 600;"></p>
        
        <div id="campoIndicado">
            <label>NOME DO AMIGO(A) INDICADO:</label>
            <input type="text" id="nomeAmigo" placeholder="Quem ganhará o presente?" oninput="atualizarLinkZap()">
            <p style="font-size: 9px; color: var(--roxo-logo); margin-top: 5px;">*O próximo passo abrirá seu WhatsApp para resgate e indicação.</p>
        </div>

        <a id="waLink" href="#" class="wa-btn" target="_blank">RESGATAR NO WHATSAPP</a>
    </div>
</div>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    
    const premiosData = [
        { name: "Cupom Indicação", chance: 45, color: "#faea60", desc: "10% para um amigo! Após ele efetuar o primeiro pedido, você garante 10% no seu próximo!" },
        { name: "15% de Desconto", chance: 30, color: "#8c52ff", desc: "Desconto especial para você usar na próxima compra!" },
        { name: "R$ 10 OFF",       chance: 18, color: "#ffb11b", desc: "Desconto fixo no valor total da sua próxima compra." },
        { name: "Mini Álbum",      chance: 5,  color: "#300870", desc: "Um Chaveirinho de 10 fotos de presente na sua próxima compra!" },
        { name: "Frete Grátis",    chance: 2,  color: "#fefefe", desc: "Sua próxima entrega é por nossa conta!" }
    ];

    let anguloAcumulado = 0;

    window.onload = function() {
        try {
            const salvo = localStorage.getItem("nostalgicas_vFinal");
            if (salvo) { exibirResultadoFinal(JSON.parse(salvo)); }
        } catch (e) {}
    };

    function draw() {
        const fatia = (2 * Math.PI) / 5;
        ctx.clearRect(0, 0, 500, 500);
        for (let i = 0; i < 5; i++) {
            ctx.save(); ctx.beginPath(); ctx.fillStyle = premiosData[i].color;
            ctx.moveTo(250, 250); ctx.arc(250, 250, 250, i * fatia - Math.PI/2, (i + 1) * fatia - Math.PI/2);
            ctx.fill(); ctx.strokeStyle = "#300870"; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
            ctx.save(); ctx.translate(250, 250); ctx.rotate(i * fatia + fatia / 2 - Math.PI / 2);
            ctx.fillStyle = (i === 1 || i === 3) ? "#ffffff" : "#300870"; 
            ctx.textAlign = "right"; ctx.font = "bold 20px Arial"; ctx.fillText(premiosData[i].name, 235, 8); ctx.restore();
        }
    }

    function validarForm() {
        const n = document.getElementById("nomeCliente").value;
        const p = document.getElementById("numPedido").value;
        const d = document.getElementById("proximoDesejo").value;
        const c = document.getElementById("checkLGPD").checked;

        if (n.length < 2 || p.length < 1 || d.length < 2) { alert("Preencha todos os campos!"); return; }
        if (!c) { alert("Você precisa aceitar os termos da LGPD para continuar."); return; }
        
        document.getElementById("formInicial").style.display = "none";
        document.getElementById("areaRoleta").style.display = "block";
        draw();
    }

    function girar() {
        const btn = document.getElementById("spinBtn");
        btn.disabled = true;

        const random = Math.random() * 100;
        let acumulado = 0; let sorteadoIndex = 0;
        for (let i = 0; i < premiosData.length; i++) {
            acumulado += premiosData[i].chance;
            if (random <= acumulado) { sorteadoIndex = i; break; }
        }

        const grausFatia = 360 / 5;
        const anguloSorteado = 360 - (sorteadoIndex * grausFatia);
        anguloAcumulado += (3600 + anguloSorteado - (grausFatia / 2));
        canvas.style.transform = `rotate(${anguloAcumulado}deg)`;

        const objGanhador = {
            nome: document.getElementById("nomeCliente").value,
            pedido: document.getElementById("numPedido").value,
            desejo: document.getElementById("proximoDesejo").value,
            premio: premiosData[sorteadoIndex].name,
            desc: premiosData[sorteadoIndex].desc
        };

        localStorage.setItem("nostalgicas_vFinal", JSON.stringify(objGanhador));
        enviarParaPlanilha(objGanhador);

        setTimeout(() => {
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.7 } });
            exibirResultadoFinal(objGanhador);
        }, 5100);
    }

    function enviarParaPlanilha(dados) {
        const amigo = document.getElementById("nomeAmigo") ? document.getElementById("nomeAmigo").value : "";
        const premioFinal = amigo ? `${dados.premio} (Amigo: ${amigo})` : dados.premio;

        fetch("https://script.google.com/macros/s/AKfycbw6Btaxwl4P257YG-_0mGOsSeUNVDGz6NfXRgvD-Jfk-CBE7ikRwIhWMdO-BbdoMyp1Rg/exec", {
            method: "POST", mode: "no-cors",
            body: JSON.stringify({
                nome: dados.nome,
                pedido: dados.pedido,
                desejo: dados.desejo,
                premio: premioFinal
            })
        });
    }

    function exibirResultadoFinal(dados) {
        document.getElementById("formInicial").style.display = "none";
        document.getElementById("areaRoleta").style.display = "none";
        document.getElementById("result").style.display = "block";
        document.getElementById("prizeText").innerText = "PARABÉNS, " + dados.nome.split(' ')[0].toUpperCase() + "!";
        document.getElementById("prizeInfo").innerText = "Você ganhou: " + dados.premio + "\n" + dados.desc;
        
        if (dados.premio === "Cupom Indicação") {
            document.getElementById("campoIndicado").style.display = "block";
            document.querySelector(".wa-btn").innerText = "RESGATAR E INDICAR AMIGO";
        }
        atualizarLinkZap();
    }

    function atualizarLinkZap() {
        const data = JSON.parse(localStorage.getItem("nostalgicas_vFinal"));
        const nomeAmigo = document.getElementById("nomeAmigo").value || "______";
        
        let msg = `Olá! Sou o(a) ${data.nome} e ganhei ${data.premio} na Roleta!\n\nPedido: #${data.pedido}\nMeu próximo desejo: ${data.desejo}`;
        
        if (data.premio === "Cupom Indicação") {
            msg += `\n\nQuero indicar o presente para: ${nomeAmigo}`;
            enviarParaPlanilha(data); // Re-envia para a planilha com o nome do amigo
        }

        document.getElementById("waLink").href = "https://api.whatsapp.com/send?phone=559184711618&text=" + encodeURIComponent(msg);
    }
</script>
</body>
</html>
