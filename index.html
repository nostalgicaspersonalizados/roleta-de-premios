<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Roleta VIP - Nostálgicas</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    
    <style>
        :root { --roxo: #8c52ff; --azul: #300870; --dourado: #ffb11b; --amarelo: #faea60; }
        body { background: #f4f4f4 url('fundotema.png') no-repeat center center fixed; background-size: cover; font-family: 'Poppins', sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        
        .box { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); max-width: 400px; width: 90%; padding: 25px; border-radius: 35px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); text-align: center; }

        /* CARD DE PRINT (O BILHETE) */
        #ticketPremio {
            display: none;
            background: linear-gradient(135deg, var(--roxo), var(--azul));
            color: white;
            padding: 25px;
            border-radius: 25px;
            border: 3px dashed var(--amarelo);
            margin: 20px 0;
            position: relative;
            box-shadow: 0 10px 20px rgba(140,82,255,0.3);
        }

        #ticketPremio h2 { font-family: 'Dancing Script', cursive; font-size: 32px; margin: 0; color: var(--amarelo); }
        .ticket-info { font-size: 14px; margin: 15px 0; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 15px; }
        .ticket-info b { color: var(--amarelo); font-size: 18px; }

        .btn-main { padding: 18px; width: 100%; border-radius: 20px; border: none; background: linear-gradient(135deg, var(--roxo), #6a32cc); color: white; font-weight: 800; cursor: pointer; text-transform: uppercase; margin-top: 10px; }
        .btn-wa { background: #25d366; }

        #canvas { width: 280px; height: 280px; border-radius: 50%; border: 8px solid var(--azul); transition: transform 5s cubic-bezier(0.1, 0, 0.2, 1); margin: 20px 0; }
        input { width: 100%; padding: 15px; margin-bottom: 10px; border-radius: 15px; border: 1px solid #ddd; box-sizing: border-box; font-family: 'Poppins'; }
        
        .hint-print { font-size: 11px; color: #666; margin-top: 10px; background: #eee; padding: 5px; border-radius: 5px; }
    </style>
</head>
<body>

<div class="box">
    <div id="formInicial">
        <img src="logo.png" style="max-width: 140px; margin-bottom: 10px;">
        <input type="text" id="nomeCliente" placeholder="Seu nome">
        <input type="text" id="numPedido" placeholder="Nº do Pedido">
        <button class="btn-main" onclick="validarForm()">Liberar Giro</button>
    </div>

    <div id="areaRoleta" style="display:none;">
        <canvas id="canvas" width="500" height="500"></canvas>
        <button id="spinBtn" class="btn-main" onclick="girar()">GIRAR AGORA!</button>
    </div>

    <div id="result" style="display:none;">
        <h3 style="color: var(--roxo); margin-bottom: 5px;">🎉 PARABÉNS!</h3>
        
        <div id="campoAmigo" style="margin-bottom: 15px;">
            <p style="font-size: 12px; font-weight: 600;">Quem você quer presentear?</p>
            <input type="text" id="nomeAmigo" placeholder="Nome do Amigo(a)" oninput="gerarTicket()">
        </div>

        <div id="ticketPremio">
            <h2>Nostálgicas</h2>
            <div class="ticket-info">
                GANHADOR: <br><b id="tktNome">---</b><br><br>
                PRÊMIO: <br><b id="tktPremio">---</b><br><br>
                INDICADO: <br><b id="tktAmigo">---</b>
            </div>
            <p style="font-size: 9px; opacity: 0.8;">Válido mediante apresentação deste print e confirmação do pedido.</p>
        </div>

        <p class="hint-print">📸 <b>Tire um print da imagem acima agora!</b></p>

        <button class="btn-main btn-wa" onclick="finalizarFluxo()">ENVIAR PRINT NO WHATSAPP</button>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/SUA_URL_AQUI/exec';
    let dados = {};

    function validarForm() {
        if(!document.getElementById("nomeCliente").value) return alert("Seu nome?");
        document.getElementById("formInicial").style.display = "none";
        document.getElementById("areaRoleta").style.display = "block";
        desenharRoleta();
    }

    function desenharRoleta() {
        const ctx = document.getElementById("canvas").getContext("2d");
        const cores = ["#8c52ff", "#faea60", "#ffb11b", "#300870", "#ffffff"];
        const nomes = ["Indicação", "15% OFF", "R$ 10 OFF", "Mini Álbum", "Frete Grátis"];
        for (let i = 0; i < 5; i++) {
            ctx.beginPath(); ctx.fillStyle = cores[i]; ctx.moveTo(250, 250);
            ctx.arc(250, 250, 250, i * 1.256, (i + 1) * 1.256); ctx.fill();
        }
    }

    function girar() {
        document.getElementById("spinBtn").disabled = true;
        const sorteio = "Cupom Indicação"; // Aqui entra sua lógica de sorteio real
        document.getElementById("canvas").style.transform = "rotate(3600deg)";
        
        dados = {
            nome: document.getElementById("nomeCliente").value,
            pedido: document.getElementById("numPedido").value,
            premio: sorteio
        };

        setTimeout(() => {
            confetti();
            document.getElementById("areaRoleta").style.display = "none";
            document.getElementById("result").style.display = "block";
            document.getElementById("ticketPremio").style.display = "block";
            gerarTicket();
        }, 5000);
    }

    function gerarTicket() {
        const amigo = document.getElementById("nomeAmigo").value || "______";
        document.getElementById("tktNome").innerText = dados.nome;
        document.getElementById("tktPremio").innerText = dados.premio;
        document.getElementById("tktAmigo").innerText = amigo;
        dados.amigo = amigo;
    }

    function finalizarFluxo() {
        // Envia para a planilha silenciosamente
        fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(dados) });

        const msg = `Olá! Acabei de ganhar na roleta! Aqui está o print do meu bilhete.\n\nPrêmio: ${dados.premio}\nIndicado: ${dados.amigo}`;
        
        // Abre o WhatsApp da loja para ele enviar o print
        window.location.href = `https://wa.me/5591984711618?text=${encodeURIComponent(msg)}`;
    }
</script>
</body>
</html>
