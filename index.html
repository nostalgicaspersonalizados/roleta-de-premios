<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roleta VIP - Nostálgicas</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { 
            --azul-escuro: #300870;
            --branco: #fefefe;
            --amarelo: #faea60;
            --dourado: #ffb11b;
            --roxo-logo: #8c52ff;
        }

        body { 
            background: url('fundotema.png') no-repeat center center fixed; 
            background-size: cover;
            text-align: center; 
            font-family: -apple-system, BlinkMacSystemFont, "comic sans", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* EFEITO GLASSMORPHISM (BLUR) */
        .box { 
            background: rgba(255, 255, 255, 0.82); 
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px); 
            max-width: 400px; 
            width: 88%;
            padding: 35px 20px; 
            border-radius: 40px; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.25); 
            border: 1px solid rgba(255,255,255,0.4); 
            position: relative;
            z-index: 5;
        }

        .logo-container img { max-width: 160px; height: auto; margin-bottom: 5px; }
        .subtitle { font-size: 10px; color: var(--roxo-logo); margin-bottom: 25px; text-transform: uppercase; letter-spacing: 2px; font-weight: 800; }
        
        label { display: block; text-align: left; margin: 15px 0 5px 30px; font-weight: 700; font-size: 11px; color: var(--azul-escuro); text-transform: uppercase; }
        
        input { 
            padding: 15px; width: 88%; border: 2px solid rgba(0,0,0,0.05); border-radius: 18px; 
            font-size: 16px; margin-bottom: 10px; outline: none; box-sizing: border-box;
            background: rgba(255,255,255,0.9); -webkit-appearance: none;
        }

        .btn-main { 
            padding: 18px; width: 90%; font-size: 17px; font-weight: 900; 
            background: linear-gradient(135deg, var(--roxo-logo), #6a32cc); 
            color: white; border: none; border-radius: 20px; cursor: pointer; margin-top: 15px;
            text-transform: uppercase; transition: 0.3s;
        }

        .canvas-wrap { position: relative; width: 290px; height: 290px; margin: 20px auto; }
        #canvas { width: 100%; height: 100%; border-radius: 50%; border: 8px solid var(--azul-escuro); transition: transform 5s cubic-bezier(0.1, 0, 0.2, 1); background: #fff; }
        .pointer { width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid var(--dourado); position: absolute; top: -15px; left: 50%; transform: translateX(-50%); z-index: 10; }
        
        #result { display: none; margin-top: 20px; border-top: 3px solid var(--amarelo); padding-top: 20px; animation: fadeIn 0.5s ease-in; }
        .wa-btn { display: inline-block; margin-top: 15px; padding: 18px; background: #25d366; color: white; text-decoration: none; border-radius: 20px; font-weight: 900; width: 85%; text-transform: uppercase; font-size: 14px; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="box">
    <div class="logo-container">
        <img src="NOSTÁLGICAS (1).png" alt="Logo Nostálgicas">
    </div>
    <p class="subtitle">Arte, Lembranças e amor</p>

    <div id="formInicial">
        <label>NÚMERO DO PEDIDO(parte superior do recibo):</label>
        <input type="text" id="numPedido" placeholder="Digite o número...">
        <label>PRÓXIMO DESEJO:</label>
        <input type="text" id="proximoDesejo" placeholder="O que quer adquirir no seu próximo pedido?">
        <button class="btn-main" onclick="validarForm()">LIBERAR MEU GIRO</button>
    </div>
    
    <div id="areaRoleta" style="display:none;">
        <div class="canvas-wrap">
            <div class="pointer"></div>
            <canvas id="canvas" width="500" height="500"></canvas>
        </div>
        <button id="spinBtn" class="btn-main" onclick="girar()">GIRAR AGORA!</button>
    </div>

    <div id="result">
        <h3 id="prizeText" style="color: var(--roxo-logo); font-size: 22px; margin: 5px 0;"></h3>
        <p id="prizeInfo" style="font-size: 15px; color: #444; margin-bottom: 20px; font-weight: 600;"></p>
        <a id="waLink" href="#" class="wa-btn" target="_blank">RESGATAR NO WHATSAPP</a>
    </div>
</div>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    
    const premiosData = [
        { name: "Cupom Indicação", chance: 45, color: "#faea60", desc: "10% para um amigo, após seu amigo efeutar o primeiro pedido já com odesconto aplicado você garante 10% de desconta no seu próximo pedido!" },
        { name: "15% de Desconto", chance: 30, color: "#8c52ff", desc: "Desconto especial para você usar na próxima compra!" },
        { name: "R$ 10 OFF",       chance: 18, color: "#ffb11b", desc: "Desconto fixo no valor total da sua próxima compra." },
        { name: "Mini Álbum",      chance: 5,  color: "#300870", desc: "Um Chaveirinho de 10 fotos de presente na sua próxima compra!" },
        { name: "Frete Grátis",    chance: 2,  color: "#fefefe", desc: "Sua próxima entrega é por nossa conta!" }
    ];

    let anguloAcumulado = 0;

    // BLOQUEIO SAFARI / CHROME / MOBILE
    function checkStatus() {
        try {
            const data = localStorage.getItem("nostalgicas_ganhou");
            if (data) {
                const dados = JSON.parse(data);
                exibirResultadoFinal(dados);
            }
        } catch (e) { console.log("Erro localstorage"); }
    }

    window.addEventListener('load', checkStatus);

    function draw() {
        const fatia = (2 * Math.PI) / 5;
        ctx.clearRect(0, 0, 500, 500);
        for (let i = 0; i < 5; i++) {
            ctx.save(); ctx.beginPath(); ctx.fillStyle = premiosData[i].color;
            ctx.moveTo(250, 250); ctx.arc(250, 250, 250, i * fatia - Math.PI/2, (i + 1) * fatia - Math.PI/2);
            ctx.fill(); ctx.strokeStyle = "#300870"; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();

            ctx.save(); ctx.translate(250, 250); ctx.rotate(i * fatia + fatia / 2 - Math.PI / 2);
            ctx.fillStyle = (i === 1 || i === 3) ? "#ffffff" : "#300870"; 
            ctx.textAlign = "right"; ctx.font = "bold 22px Arial"; ctx.fillText(premiosData[i].name, 230, 8); ctx.restore();
        }
    }

    function validarForm() {
        const p = document.getElementById("numPedido").value;
        const d = document.getElementById("proximoDesejo").value;
        if (p.length < 1 || d.length < 2) { alert("Preencha os campos!"); return; }
        document.getElementById("formInicial").style.display = "none";
        document.getElementById("areaRoleta").style.display = "block";
        draw();
    }

    function girar() {
        const btn = document.getElementById("spinBtn");
        btn.disabled = true; btn.innerText = "SORTEANDO...";

        const random = Math.random() * 100;
        let acumulado = 0; let sorteadoIndex = 0;
        for (let i = 0; i < premiosData.length; i++) {
            acumulado += premiosData[i].chance;
            if (random <= acumulado) { sorteadoIndex = i; break; }
        }

        const grausFatia = 360 / 5;
        const anguloSorteado = 360 - (sorteadoIndex * grausFatia);
        anguloAcumulado += (3600 + anguloSorteado - (grausFatia / 2));
        canvas.style.transform = `rotate(${anguloAcumulado}deg)`;

        const objGanhador = {
            pedido: document.getElementById("numPedido").value,
            desejo: document.getElementById("proximoDesejo").value,
            premio: premiosData[sorteadoIndex].name,
            desc: premiosData[sorteadoIndex].desc
        };

        // SALVA ANTES DE EXIBIR (Prevenção Safari)
        try { localStorage.setItem("nostalgicas_ganhou", JSON.stringify(objGanhador)); } catch(e){}

        // PLANILHA
        fetch("https://script.google.com/macros/s/AKfycbw6Btaxwl4P257YG-_0mGOsSeUNVDGz6NfXRgvD-Jfk-CBE7ikRwIhWMdO-BbdoMyp1Rg/exec", {
            method: "POST", mode: "no-cors", body: JSON.stringify(objGanhador)
        });

        setTimeout(() => {
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.7 } });
            exibirResultadoFinal(objGanhador);
        }, 5100);
    }

    function exibirResultadoFinal(dados) {
        document.getElementById("formInicial").style.display = "none";
        document.getElementById("areaRoleta").style.display = "none";
        const res = document.getElementById("result");
        res.style.display = "block";
        document.getElementById("prizeText").innerText = "GANHOU: " + dados.premio;
        document.getElementById("prizeInfo").innerText = dados.desc;
        
        const linkWA = "https://api.whatsapp.com/send?phone=559184711618&text=" + encodeURIComponent(`Ganhei ${dados.premio}!\nPedido: #${dados.pedido}\nDesejo: ${dados.desejo}`);
        document.getElementById("waLink").href = linkWA;
    }
</script>
</body>
</html>
