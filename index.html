<div id="result">
        <h3 id="prizeText" style="color: var(--roxo-logo); font-size: 20px; margin: 5px 0;"></h3>
        <p id="prizeInfo" style="font-size: 14px; color: #444; margin-bottom: 10px; font-weight: 600;"></p>
        
        <div id="campoIndicado">
            <label>NOME DO AMIGO(A) INDICADO:</label>
            <input type="text" id="nomeAmigo" placeholder="Quem ganhará o presente?" oninput="atualizarLinkZap()">
        </div>

        <a id="waLink" href="#" class="wa-btn" target="_blank" onclick="proximoPassoIndica()">1º PASSO: ME AVISE NO WHATSAPP</a>
        
        <p id="instrucaoPasso" style="font-size: 10px; color: #888; margin-top: 10px;">Você precisa nos avisar primeiro para validarmos o prêmio.</p>
    </div>

<script>
    // ... (Mantenha as funções de draw, validarForm e girar iguais) ...

    let passoIndica = 1;

    function proximoPassoIndica() {
        const dados = JSON.parse(localStorage.getItem("nostalgicas_vFinal"));
        const nomeAmigo = document.getElementById("nomeAmigo").value || "seu amigo";

        if (dados.premio === "Cupom Indicação" && passoIndica === 1) {
            // Muda o botão para o 2º Passo após o primeiro clique
            setTimeout(() => {
                passoIndica = 2;
                const btn = document.getElementById("waLink");
                btn.innerText = `2º PASSO: ENVIAR PRESENTE PARA ${nomeAmigo.toUpperCase()}`;
                btn.style.background = "#007bff"; // Muda para azul para destacar
                document.getElementById("instrucaoPasso").innerText = "Agora clique acima para enviar o cupom direto para o seu amigo!";
                atualizarLinkZap();
            }, 2000);
        }
    }

    function atualizarLinkZap() {
        const data = JSON.parse(localStorage.getItem("nostalgicas_vFinal"));
        const nomeAmigo = document.getElementById("nomeAmigo").value || "______";
        const btn = document.getElementById("waLink");
        
        if (passoIndica === 1) {
            // MENSAGEM PARA VOCÊ (ARTESÃ)
            let msgLoja = `Olá! Sou o(a) ${data.nome} e ganhei ${data.premio} na Roleta!\n\nPedido: #${data.pedido}\nIndico o presente para: ${nomeAmigo}`;
            btn.href = "https://api.whatsapp.com/send?phone=559184711618&text=" + encodeURIComponent(msgLoja);
            enviarParaPlanilha(data); 
        } else {
            // MENSAGEM PARA O AMIGO (CLIENTE -> AMIGO)
            let msgAmigo = `Oi, ${nomeAmigo}! Ganhei um presente na Nostálgicas Personalizados e escolhi você para ganhar 10% de desconto também! 🎁\n\nDá uma olhadinha no trabalho deles, é lindo: https://www.instagram.com/seu_instagram`;
            btn.href = "https://api.whatsapp.com/send?text=" + encodeURIComponent(msgAmigo);
        }
    }

    // ... (Mantenha o restante das funções iguais) ...
</script>
