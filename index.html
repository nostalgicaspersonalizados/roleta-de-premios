<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roleta VIP - Nostálgicas</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --azul-escuro: #300870;
            --branco: #fefefe;
            --amarelo: #faea60;
            --dourado: #ffb11b;
            --roxo-logo: #8c52ff;
            --gradiente-premio: linear-gradient(135deg, #8c52ff 0%, #ffb11b 100%);
        }

        body { 
            background: url('fundotema.png') no-repeat center center fixed; 
            background-size: cover;
            text-align: center; 
            font-family: 'Poppins', sans-serif; /* Fonte base mais moderna */
            margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh;
            overflow-x: hidden;
        }

        /* CONTAINER PRINCIPAL COM EFEITO BLUR */
        .box { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); 
            max-width: 420px; width: 90%; padding: 35px 25px; border-radius: 40px; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.4); 
            transition: all 0.3s ease;
        }

        .logo-container img { max-width: 160px; height: auto; margin-bottom: 5px; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1)); }
        
        .subtitle { 
            font-family: 'Dancing Script', cursive;
            font-size: 24px; color: var(--roxo-logo); margin: 0 0 25px 0; font-weight: 700;
        }
        
        /* ESTILIZAÇÃO DO FORMULÁRIO */
        #formInicial label { display: block; text-align: left; margin: 12px 0 4px 25px; font-weight: 600; font-size: 11px; color: var(--azul-escuro); text-transform: uppercase; letter-spacing: 1px; }
        
        #formInicial input[type="text"] { 
            padding: 15px; width: 90%; border: 2px solid rgba(0,0,0,0.05); border-radius: 18px; 
            font-size: 15px; margin-bottom: 8px; outline: none; box-sizing: border-box; background: rgba(255,255,255,0.9);
            transition: 0.3s;
        }
        #formInicial input[type="text"]:focus { border-color: var(--roxo-logo); box-shadow: 0 0 15px rgba(140,82,255,0.2); }

        .lgpd-container { display: flex; align-items: flex-start; justify-content: center; margin: 15px 20px; gap: 10px; text-align: left; }
        .lgpd-container input { margin-top: 4px; transform: scale(1.2); cursor: pointer; }
        .lgpd-container label { margin: 0; font-size: 10px; color: #555; text-transform: none; line-height: 1.4; cursor: pointer; }

        .btn-main { 
            padding: 20px; width: 90%; font-size: 18px; font-weight: 800; 
            background: linear-gradient(135deg, var(--roxo-logo), #6a32cc); 
            color: white; border: none; border-radius: 20px; cursor: pointer; margin-top: 15px;
            text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 10px 25px rgba(140,82,255,0.4);
            transition: 0.3s;
        }
        .btn-main:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(140,82,255,0.5); }
        .btn-main:active { transform: translateY(1px); }

        /* ESTILIZAÇÃO DA ROLETA */
        .canvas-wrap { position: relative; width: 300px; height: 300px; margin: 25px auto; }
        #canvas { width: 100%; height: 100%; border-radius: 50%; border: 10px solid var(--azul-escuro); transition: transform 5s cubic-bezier(0.1, 0, 0.2, 1); background: #fff; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        .pointer { width: 0; height: 0; border-left: 18px solid transparent; border-right: 18px solid transparent; border-top: 35px solid var(--dourado); position: absolute; top: -15px; left: 50%; transform: translateX(-50%); z-index: 10; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.3)); }
        
        /* --- NOVA ESTILIZAÇÃO DA TELA DE RESULTADO (A "CAIXA FEIA" VIROU ISSO) --- */
        #result { 
            display: none; margin-top: 20px; border-top: 4px solid var(--amarelo); padding-top: 25px; 
            animation: slideUp 0.6s ease-out; /* Animação de entrada */
        }

        .premio-card {
            background: var(--gradiente-premio);
            border-radius: 25px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            border: 3px solid var(--dourado);
            position: relative;
            overflow: hidden;
        }
        /* Efeito de brilho no card */
        .premio-card::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0) 100%);
            transform: rotate(45deg); animation: shine 3s infinite;
        }

        .premio-icone { font-size: 50px; margin-bottom: 10px; display: block; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.2)); }
        
        #prizeText { 
            font-size: 28px; font-weight: 800; color: var(--branco); 
            margin: 0 0 10px 0; text-transform: uppercase; letter-spacing: 1px;
            text-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }
        
        #prizeInfo { font-size: 15px; color: rgba(255,255,255,0.9); margin: 0; font-weight: 600; line-height: 1.5; }
        
        /* Campo do Amigo dentro do card (condicional) */
        #campoIndicado { 
            display: none; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.3); padding-top: 15px; 
            animation: fadeIn 0.5s; 
        }
        #campoIndicado label { color: var(--branco); text-align: center; margin-left: 0; font-size: 12px; margin-bottom: 8px; }
        #nomeAmigo { 
            padding: 12px; width: 100%; border: none; border-radius: 12px; 
            font-size: 14px; outline: none; box-sizing: border-box; background: rgba(255,255,255,0.9);
            text-align: center; font-weight: 600;
        }

        /* Botão de Resgate Estilizado */
        .wa-btn { 
            display: inline-block; margin-top: 10px; padding: 20px; background: #25d366; 
            color: white; text-decoration: none; border-radius: 20px; font-weight: 800; 
            width: 90%; text-transform: uppercase; font-size: 15px; letter-spacing: 1px;
            box-shadow: 0 10px 25px rgba(37,211,102,0.4); transition: 0.3s;
        }
        .wa-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(37,211,102,0.5); }
        
        #instrucaoPasso { font-size: 11px; color: var(--azul-escuro); margin-top: 12px; font-weight: 600; font-style: italic; }

        /* ANIMAÇÕES */
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes shine { 0% { left: -50%; } 100% { left: 150%; } }

    </style>
</head>
<body>

<div class="box">
    <div class="logo-container">
        <img src="NOSTÁLGICAS (1).png" alt="Logo Nostálgicas">
    </div>
    <p class="subtitle">Arte, Lembranças e amor</p>

    <div id="formInicial">
        <label>COMO PODEMOS TE CHAMAR?</label>
        <input type="text" id="nomeCliente" placeholder="Seu nome">

        <label>NÚMERO DO PEDIDO (Superior do recibo):</label>
        <input type="text" id="numPedido" placeholder="Digite o número...">
        
        <label>O QUE QUER ADQUIRIR NO PRÓXIMO PEDIDO?</label>
        <input type="text" id="proximoDesejo" placeholder="Caneca, Álbum, Quadro...">

        <div class="lgpd-container">
            <input type="checkbox" id="checkLGPD">
            <label for="checkLGPD">Autorizo o uso dos meus dados pela Nostálgicas para fins de sorteio e contato, conforme a LGPD.</label>
        </div>
        <button class="btn-main" onclick="validarForm()">LIBERAR MEU GIRO</button>
    </div>
    
    <div id="areaRoleta" style="display:none;">
        <div class="canvas-wrap">
            <div class="pointer"></div>
            <canvas id="canvas" width="500" height="500"></canvas>
        </div>
        <button id="spinBtn" class="btn-main" onclick="girar()">GIRAR AGORA!</button>
    </div>

    <div id="result">
        <div class="premio-card">
            <span id="premioIcone" class="premio-icone">🏆</span>
            <h3 id="prizeText"></h3>
            <p id="prizeInfo"></p>
            
            <div id="campoIndicado">
                <label>NOME DO AMIGO(A) INDICADO:</label>
                <input type="text" id="nomeAmigo" placeholder="Quem ganhará o presente?" oninput="atualizarLinkZap()">
            </div>
        </div>

        <a id="waLink" href="#" class="wa-btn" target="_blank" onclick="proximoPassoIndica()">1º PASSO: ME AVISE NO WHATSAPP</a>
        
        <p id="instrucaoPasso">Você precisa nos avisar primeiro para validarmos o prêmio.</p>
    </div>
</div>
