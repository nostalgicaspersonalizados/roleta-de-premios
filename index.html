<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Roleta VIP - Nostálgicas</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --azul-escuro: #300870;
            --roxo-logo: #8c52ff;
            --amarelo: #faea60;
            --dourado: #ffb11b;
            --gradiente-premio: linear-gradient(135deg, #8c52ff 0%, #300870 100%);
        }

        body { 
            background: #f4f4f4 url('fundotema.png') no-repeat center center fixed; 
            background-size: cover; text-align: center; font-family: 'Poppins', sans-serif;
            margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh;
        }

        .box { 
            background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            max-width: 420px; width: 90%; padding: 35px 25px; border-radius: 40px; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.4); 
            box-sizing: border-box;
        }

        .logo-container img { max-width: 160px; margin-bottom: 5px; }
        .subtitle { font-family: 'Dancing Script', cursive; font-size: 24px; color: var(--roxo-logo); margin-bottom: 25px; font-weight: 700; }
        
        #formInicial label { display: block; text-align: left; margin: 12px 0 4px 25px; font-weight: 600; font-size: 11px; color: var(--azul-escuro); text-transform: uppercase; letter-spacing: 1px; }
        #formInicial input { padding: 15px; width: 90%; border: 2px solid rgba(0,0,0,0.05); border-radius: 18px; margin-bottom: 8px; outline: none; box-sizing: border-box; background: rgba(255,255,255,0.9); }

        .lgpd-container { display: flex; align-items: flex-start; justify-content: center; margin: 15px 10px; gap: 10px; text-align: left; }
        .lgpd-container input { margin-top: 4px; transform: scale(1.3); cursor: pointer; }
        .lgpd-container label { margin: 0; font-size: 10px; color: #555; line-height: 1.4; cursor: pointer; }

        .btn-main { padding: 20px; width: 90%; font-size: 18px; font-weight: 800; background: linear-gradient(135deg, var(--roxo-logo), #6a32cc); color: white; border: none; border-radius: 20px; cursor: pointer; text-transform: uppercase; box-shadow: 0 10px 25px rgba(140,82,255,0.4); }

        .canvas-wrap { position: relative; width: 280px; height: 280px; margin: 25px auto; }
        #canvas { width: 100%; height: 100%; border-radius: 50%; border: 10px solid var(--azul-escuro); transition: transform 5s cubic-bezier(0.1, 0, 0.2, 1); background: #fff; }
        .pointer { width: 0; height: 0; border-left: 18px solid transparent; border-right: 18px solid transparent; border-top: 35px solid var(--dourado); position: absolute; top: -15px; left: 50%; transform: translateX(-50%); z-index: 10; }
        
        #result { display: none; margin-top: 10px; padding-top: 15px; border-top: 4px solid var(--amarelo); animation: slideUp 0.6s ease-out; }

        .ticket-confirmacao { background: var(--gradiente-premio); border: 3px dashed var(--amarelo); border-radius: 30px; padding: 30px 20px; margin-bottom: 20px; color: white; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        .ticket-confirmacao h2 { font-family: 'Dancing Script', cursive; color: var(--amarelo); font-size: 30px; margin: 0 0 10px 0; }
        .ticket-item { margin: 10px 0; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; }
        .ticket-label { font-size: 10px; text-transform: uppercase; opacity: 0.8; }
        .ticket-value { font-size: 18px; font-weight: 800; display: block; color: #fff; }
        .ticket-desc { font-size: 12px; color: #fff; margin-top: 5px; font-weight: 600; line-height: 1.3; display: block; opacity: 0.9; }
        
        .ticket-validade { font-size: 12px; color: var(--amarelo); font-weight: 800; margin-top: 10px; display: block; border: 1px dashed rgba(250, 234, 96, 0.4); padding: 5px; border-radius: 10px; }

        #campoIndicado { display: none; margin-top: 15px; }
        #nomeAmigo { padding: 12px; width: 85%; border-radius: 12px; border: none; text-align: center; font-weight: 700; outline: none; background: #fff; color: var(--azul-escuro); margin-top: 5px; }

        .wa-btn { display: inline-block; padding: 22px; background: #25d366; color: white; text-decoration: none; border-radius: 22px; font-weight: 800; width: 90%; text-transform: uppercase; font-size: 13px; box-shadow: 0 10px 25px rgba(37,211,102,0.4); }
        .print-hint { font-size: 12px; color: var(--azul-escuro); font-weight: 800; margin-bottom: 10px; background: var(--amarelo); padding: 8px; border-radius: 12px; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="box">
    <div class="logo-container"><img src="NOSTÁLGICAS (1).png" alt="Logo Nostálgicas"></div>
    <p class="subtitle">Arte, Lembranças e amor</p>

    <div id="formInicial">
        <label>COMO PODEMOS TE CHAMAR?</label>
        <input type="text" id="nomeCliente" placeholder="Seu nome">
        <label>NÚMERO DO PEDIDO:</label>
        <input type="text" id="numPedido" placeholder="Digite o número...">
        <label>PRÓXIMO DESEJO:</label>
        <input type="text" id="proximoDesejo" placeholder="O que pretende comprar?">
        
        <div class="lgpd-container">
            <input type="checkbox" id="checkLGPD">
            <label for="checkLGPD">Autorizo o uso dos meus dados pela Nostálgicas conforme a LGPD.</label>
        </div>
        
        <button class="btn-main" onclick="validarForm()">LIBERAR MEU GIRO</button>
    </div>
    
    <div id="areaRoleta" style="display:none;">
        <div class="canvas-wrap"><div class="pointer"></div><canvas id="canvas" width="500" height="500"></canvas></div>
        <button id="spinBtn" class="btn-main" onclick="girar()">GIRAR AGORA!</button>
    </div>

    <div id="result">
        <div class="print-hint">📸 TIRE UM PRINT DO SEU BILHETE AGORA!</div>
        
        <div class="ticket-confirmacao">
            <h2>Nostálgicas</h2>
            <div class="ticket-item"><span class="ticket-label">Ganhador(a):</span><span class="ticket-value" id="resNome">---</span></div>
            <div class="ticket-item">
                <span class="ticket-label">Prêmio:</span>
                <span class="ticket-value" id="resPremio">---</span>
                <span class="ticket-desc" id="resDesc"></span>
                <span class="ticket-validade" id="resValidade"></span>
            </div>
            <div id="campoIndicado"><span class="ticket-label">Amigo(a) Indicado(a):</span><input type="text" id="nomeAmigo" placeholder="Nome de quem ganha 10%" oninput="atualizarLinkFinal()"></div>
        </div>
        
        <a id="waLinkFinal" href="#" class="wa-btn" onclick="return verificarAcao(event)">COMPARTILHAR BILHETE</a>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbz-Ln1euYgByiQQBuxyPhqqK4NW_2Ia494Z1fhNv5j7XG2-wsuNEng0zI8Kd-UC2xNykQ/exec';
    
    const premiosData = [
        { name: "Cupom Indicação", desc: "Indique um amigo! Quando ele comprar, você e ele ganham 10% OFF.", chance: 45, color: "#faea60" }, 
        { name: "Frete Grátis",    desc: "Válido para todo o Brasil em pedidos acima de R$150.", chance: 2,  color: "#fefefe" }, 
        { name: "Mini Álbum",      desc: "Ganhou 1 Mini Álbum de figurinhas personalizado!", chance: 5,  color: "#300870" }, 
        { name: "R$ 10 OFF",       desc: "Desconto de R$10 para usar em qualquer item da loja.", chance: 18, color: "#ffb11b" }, 
        { name: "15% de Desconto", desc: "Aplique 15% de desconto no total da sua próxima compra.", chance: 30, color: "#8c52ff" }  
    ];

    let anguloAcumulado = 0;
    let dadosGanhador = {};

    function draw() {
        const canvas = document.getElementById("canvas");
        if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const fatia = (2 * Math.PI) / 5;
        ctx.clearRect(0, 0, 500, 500);

        for (let i = 0; i < 5; i++) {
            ctx.save();
            ctx.beginPath();
            ctx.fillStyle = premiosData[i].color;
            ctx.moveTo(250, 250);
            ctx.arc(250, 250, 250, i * fatia - Math.PI/2, (i + 1) * fatia - Math.PI/2);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "rgba(0,0,0,0.1)";
            ctx.stroke();
            ctx.restore();

            ctx.save();
            ctx.translate(250, 250);
            ctx.rotate(i * fatia + fatia/2 - Math.PI/2);
            ctx.fillStyle = (premiosData[i].color === "#300870" || premiosData[i].color === "#8c52ff") ? "#fff" : "#300870"; 
            ctx.textAlign = "right";
            ctx.font = "bold 22px Poppins";
            ctx.fillText(premiosData[i].name, 230, 10);
            ctx.restore();
        }
    }

    function validarForm() {
        if (document.getElementById("nomeCliente").value.length < 2) { alert("Por favor, digite seu nome!"); return; }
        if (!document.getElementById("checkLGPD").checked) { alert("Aceite os termos."); return; }
        document.getElementById("formInicial").style.display = "none";
        document.getElementById("areaRoleta").style.display = "block";
        requestAnimationFrame(() => draw());
    }

    function calcularValidade() {
        const hoje = new Date();
        hoje.setDate(hoje.getDate() + 40); // Mantido em 40 dias conforme seu pedido
        return hoje.toLocaleDateString('pt-BR');
    }

    function girar() {
        if (localStorage.getItem("nostalgicas_v2026")) return;
        const btn = document.getElementById("spinBtn");
        btn.disabled = true;
        btn.style.opacity = "0.5";

        const random = Math.random() * 100;
        let acumulado = 0; let sorteadoIndex = 0;
        for (let i = 0; i < premiosData.length; i++) {
            acumulado += premiosData[i].chance;
            if (random <= acumulado) { sorteadoIndex = i; break; }
        }

        const grausPorFatia = 72;
        const anguloAlvo = 360 - (sorteadoIndex * grausPorFatia);
        const ajusteCentro = grausPorFatia / 2;
        
        anguloAcumulado += (360 * 8) + anguloAlvo - ajusteCentro;
        document.getElementById("canvas").style.transform = `rotate(${anguloAcumulado}deg)`;

        dadosGanhador = {
            nome: document.getElementById("nomeCliente").value,
            pedido: document.getElementById("numPedido").value || "N/A",
            desejo: document.getElementById("proximoDesejo").value || "N/A",
            premio: premiosData[sorteadoIndex].name,
            detalhe: premiosData[sorteadoIndex].desc,
            validade: calcularValidade()
        };

        localStorage.setItem("nostalgicas_v2026", JSON.stringify(dadosGanhador));

        setTimeout(() => {
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.7 } });
            exibirResultado();
            if (dadosGanhador.premio !== "Cupom Indicação") enviarDadosPlanilha(dadosGanhador);
        }, 5200);
    }

    function exibirResultado() {
        document.getElementById("formInicial").style.display = "none";
        document.getElementById("areaRoleta").style.display = "none";
        document.getElementById("result").style.display = "block";
        
        document.getElementById("resNome").innerText = dadosGanhador.nome;
        document.getElementById("resPremio").innerText = dadosGanhador.premio;
        document.getElementById("resDesc").innerText = dadosGanhador.detalhe;
        document.getElementById("resValidade").innerText = "📅 Válido até: " + dadosGanhador.validade;

        if (dadosGanhador.premio === "Cupom Indicação") {
            document.getElementById("campoIndicado").style.display = "block";
        }
        atualizarLinkFinal();
    }

    function atualizarLinkFinal() {
        const amigo = document.getElementById("nomeAmigo").value || "______";
        const btn = document.getElementById("waLinkFinal");
        
        // Formatação robusta para evitar "?" no lugar dos emojis
        const emojiPresente = "\uD83C\uDF81";
        const emojiGanhador = "\uD83D\uDCC4";
        const emojiData = "\uD83D\uDCC5";

        let texto = `${emojiPresente} *BILHETE PREMIADO - NOSTÁLGICAS!* \n\n` +
                    `Olá! Ganhei um presente na roleta!\n\n` +
                    `${emojiGanhador} *Ganhador:* ${dadosGanhador.nome}\n` +
                    `🏆 *Prêmio:* ${dadosGanhador.premio}\n` +
                    `📝 *Detalhe:* ${dadosGanhador.detalhe}\n` +
                    `${emojiData} *Válido até:* ${dadosGanhador.validade}\n` +
                    `🎁 *Amigo Indicado:* ${amigo}`;
                    
        btn.href = `https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`;
    }

    function enviarDadosPlanilha(dados) {
        const params = new URLSearchParams();
        params.append("nome", dados.nome);
        params.append("pedido", dados.pedido);
        params.append("desejo", dados.desejo);
        params.append("premio", dados.premio);
        params.append("amigo", document.getElementById("nomeAmigo").value || "N/A");
        fetch(scriptURL, { method: 'POST', body: params, mode: 'no-cors' });
    }

    function verificarAcao(e) {
        if (dadosGanhador.premio === "Cupom Indicação") {
            if (!document.getElementById("nomeAmigo").value) {
                alert("Por favor, digite o nome do amigo antes de compartilhar!");
                return false;
            }
            enviarDadosPlanilha(dadosGanhador);
        }
        return true;
    }

    window.onload = () => {
        const salvo = localStorage.getItem("nostalgicas_v2026");
        if (salvo) {
            dadosGanhador = JSON.parse(salvo);
            exibirResultado();
        }
    };
</script>
</body>
</html>
