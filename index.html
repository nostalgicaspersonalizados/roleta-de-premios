<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roleta VIP - Nostálgicas</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --azul-escuro: #300870;
            --roxo-logo: #8c52ff;
            --amarelo: #faea60;
            --dourado: #ffb11b;
            --gradiente-premio: linear-gradient(135deg, #8c52ff 0%, #ffb11b 100%);
        }

        body { 
            background: #f4f4f4 url('fundotema.png') no-repeat center center fixed; 
            background-size: cover; text-align: center; font-family: 'Poppins', sans-serif;
            margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh;
        }

        .box { 
            background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(20px); 
            max-width: 420px; width: 90%; padding: 35px 25px; border-radius: 40px; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.4); 
            box-sizing: border-box;
        }

        .logo-container img { max-width: 160px; margin-bottom: 5px; }
        .subtitle { font-family: 'Dancing Script', cursive; font-size: 24px; color: var(--roxo-logo); margin-bottom: 25px; }
        
        #formInicial label { display: block; text-align: left; margin: 12px 0 4px 25px; font-weight: 600; font-size: 11px; color: var(--azul-escuro); text-transform: uppercase; }
        #formInicial input { padding: 15px; width: 90%; border: 2px solid rgba(0,0,0,0.05); border-radius: 18px; margin-bottom: 8px; outline: none; box-sizing: border-box; }

        .lgpd-container { display: flex; align-items: flex-start; margin: 15px 10px; gap: 10px; text-align: left; }
        .lgpd-container label { font-size: 10px; color: #555; cursor: pointer; }

        .btn-main { padding: 20px; width: 90%; font-size: 18px; font-weight: 800; background: linear-gradient(135deg, var(--roxo-logo), #6a32cc); color: white; border: none; border-radius: 20px; cursor: pointer; text-transform: uppercase; }

        .canvas-wrap { position: relative; width: 280px; height: 280px; margin: 25px auto; }
        #canvas { width: 100%; height: 100%; border-radius: 50%; border: 10px solid var(--azul-escuro); transition: transform 5s cubic-bezier(0.1, 0, 0.2, 1); background: #fff; }
        .pointer { width: 0; height: 0; border-left: 18px solid transparent; border-right: 18px solid transparent; border-top: 35px solid var(--dourado); position: absolute; top: -15px; left: 50%; transform: translateX(-50%); z-index: 10; }
        
        #result { display: none; margin-top: 20px; padding-top: 25px; border-top: 4px solid var(--amarelo); }
        .premio-card { background: var(--gradiente-premio); border-radius: 30px; padding: 30px 20px; margin-bottom: 20px; border: 3px solid var(--dourado); color: white; }
        
        #campoIndicado { display: none; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.3); padding-top: 20px; }
        #nomeAmigo { padding: 15px; width: 100%; border-radius: 15px; border: none; text-align: center; font-weight: 700; outline: none; }

        .wa-btn { display: inline-block; padding: 22px; background: #25d366; color: white; text-decoration: none; border-radius: 22px; font-weight: 800; width: 90%; text-transform: uppercase; font-size: 13px; box-shadow: 0 10px 25px rgba(37,211,102,0.4); }
    </style>
</head>
<body>

<div class="box">
    <div class="logo-container"><img src="NOSTÁLGICAS (1).png" alt="Logo Nostálgicas"></div>
    <p class="subtitle">Arte, Lembranças e amor</p>

    <div id="formInicial">
        <label>COMO PODEMOS TE CHAMAR?</label>
        <input type="text" id="nomeCliente" placeholder="Seu nome">
        <label>NÚMERO DO PEDIDO:</label>
        <input type="text" id="numPedido" placeholder="Digite o número...">
        <label>PRÓXIMO DESEJO:</label>
        <input type="text" id="proximoDesejo" placeholder="O que pretende comprar?">
        <div class="lgpd-container">
            <input type="checkbox" id="checkLGPD">
            <label for="checkLGPD">Autorizo o uso dos meus dados (LGPD).</label>
        </div>
        <button class="btn-main" onclick="validarForm()">LIBERAR MEU GIRO</button>
    </div>
    
    <div id="areaRoleta" style="display:none;">
        <div class="canvas-wrap"><div class="pointer"></div><canvas id="canvas" width="500" height="500"></canvas></div>
        <button id="spinBtn" class="btn-main" onclick="girar()">GIRAR AGORA!</button>
    </div>

    <div id="result">
        <div class="premio-card">
            <span id="premioIcone" style="font-size:55px; display:block; margin-bottom:15px;">🏆</span>
            <h3 id="prizeText"></h3>
            <p id="prizeInfo"></p>
            <div id="campoIndicado">
                <label style="font-weight: 800; font-size: 12px; margin-bottom: 8px; display: block;">NOME DO AMIGO(A) INDICADO:</label>
                <input type="text" id="nomeAmigo" placeholder="Quem ganhará?" oninput="atualizarLinkFinal()">
            </div>
        </div>
        <a id="waLinkFinal" href="#" class="wa-btn" target="_blank" onclick="return verificarAcao(event)">1º PASSO: VALIDAR NO WHATSAPP</a>
        <p id="instrucaoPasso" style="font-size: 11px; font-weight: 600; margin-top: 15px;">Você precisa nos avisar para validarmos o prêmio.</p>
    </div>
</div>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const premiosData = [
        { name: "Cupom Indicação", chance: 45, color: "#faea60", icone: "🎁", desc: "Ganhe 10% de desconto indicando um amigo!" },
        { name: "15% de Desconto", chance: 30, color: "#8c52ff", icone: "🎉", desc: "Use na sua próxima compra!" },
        { name: "R$ 10 OFF",       chance: 18, color: "#ffb11b", icone: "💰", desc: "Desconto de R$10 no pedido." },
        { name: "Mini Álbum",      chance: 5,  color: "#300870", icone: "📸", desc: "Um brinde especial para você!" },
        { name: "Frete Grátis",    chance: 2,  color: "#fefefe", icone: "🚚", desc: "Próxima entrega por nossa conta!" }
    ];

    let anguloAcumulado = 0;
    let passoGlobal = 1;
    let dadosGanhador = {};

    function draw() {
        const fatia = (2 * Math.PI) / 5;
        ctx.clearRect(0, 0, 500, 500);
        for (let i = 0; i < 5; i++) {
            ctx.save(); ctx.beginPath(); ctx.fillStyle = premiosData[i].color;
            ctx.moveTo(250, 250); ctx.arc(250, 250, 250, i * fatia - Math.PI/2, (i + 1) * fatia - Math.PI/2);
            ctx.fill(); ctx.restore();
            ctx.save(); ctx.translate(250, 250); ctx.rotate(i * fatia + fatia / 2 - Math.PI / 2);
            ctx.fillStyle = (i === 1 || i === 3) ? "#fff" : "#300870"; 
            ctx.textAlign = "right"; ctx.font = "bold 22px Arial"; ctx.fillText(premiosData[i].name, 230, 8); ctx.restore();
        }
    }

    function validarForm() {
        if (document.getElementById("nomeCliente").value.length < 2) { alert("Digite seu nome!"); return; }
        if (!document.getElementById("checkLGPD").checked) { alert("Aceite os termos LGPD."); return; }
        document.getElementById("formInicial").style.display = "none";
        document.getElementById("areaRoleta").style.display = "block";
        draw();
    }

    function girar() {
        document.getElementById("spinBtn").disabled = true;
        const random = Math.random() * 100;
        let acumulado = 0; let sorteadoIndex = 0;
        for (let i = 0; i < premiosData.length; i++) {
            acumulado += premiosData[i].chance;
            if (random <= acumulado) { sorteadoIndex = i; break; }
        }
        anguloAcumulado += (3600 + (360 - (sorteadoIndex * 72)) - 36);
        canvas.style.transform = `rotate(${anguloAcumulado}deg)`;

        dadosGanhador = {
            nome: document.getElementById("nomeCliente").value,
            pedido: document.getElementById("numPedido").value,
            desejo: document.getElementById("proximoDesejo").value,
            premio: premiosData[sorteadoIndex].name,
            desc: premiosData[sorteadoIndex].desc,
            icone: premiosData[sorteadoIndex].icone
        };

        setTimeout(() => {
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.7 } });
            exibirResultado();
        }, 5100);
    }

    function exibirResultado() {
        document.getElementById("areaRoleta").style.display = "none";
        document.getElementById("result").style.display = "block";
        document.getElementById("prizeText").innerText = dadosGanhador.premio;
        document.getElementById("prizeInfo").innerText = dadosGanhador.desc;
        document.getElementById("premioIcone").innerText = dadosGanhador.icone;
        if (dadosGanhador.premio === "Cupom Indicação") document.getElementById("campoIndicado").style.display = "block";
        atualizarLinkFinal();
    }

    function atualizarLinkFinal() {
        const amigo = document.getElementById("nomeAmigo").value || "______";
        const btn = document.getElementById("waLinkFinal");
        
        if (passoGlobal === 1) {
            // MENSAGEM PARA VOCÊ (A LOJA)
            // USANDO LINK DIRETO PARA FORÇAR A MENSAGEM PRONTA
            let texto = `Olá Nostálgicas! Sou ${dadosGanhador.nome} e ganhei ${dadosGanhador.premio} na roleta!\n\n📌 *DADOS DO SORTEIO*:\n👤 Nome: ${dadosGanhador.nome}\n📦 Pedido: #${dadosGanhador.pedido}\n✨ Desejo: ${dadosGanhador.desejo}`;
            if (dadosGanhador.premio === "Cupom Indicação") texto += `\n🎁 Indicação para: ${amigo}`;
            
            // Substituímos o link encurtado pelo link direto do seu WhatsApp
            btn.href = `https://api.whatsapp.com/send?phone=5591981242337&text=${encodeURIComponent(texto)}`;
        } else {
            // MENSAGEM PARA O AMIGO
            let textoAmigo = `Oi, ${amigo}! Ganhei um presente na Nostálgicas e escolhi você para ganhar 10% de desconto também! 🎁\n\nVeja o Instagram deles aqui: https://www.instagram.com/nostalgicas.personalizados/`;
            btn.href = `https://api.whatsapp.com/send?text=${encodeURIComponent(textoAmigo)}`;
        }
    }

    function verificarAcao(e) {
        if (dadosGanhador.premio === "Cupom Indicação" && !document.getElementById("nomeAmigo").value) {
            alert("Digite o nome do amigo antes de enviar!");
            return false;
        }
        
        if (dadosGanhador.premio === "Cupom Indicação" && passoGlobal === 1) {
            setTimeout(() => {
                passoGlobal = 2;
                const btn = document.getElementById("waLinkFinal");
                btn.innerText = "2º PASSO: ENVIAR PARA O AMIGO";
                btn.style.background = "#007bff";
                atualizarLinkFinal();
            }, 1000);
        }
        return true;
    }
</script>
</body>
</html>
