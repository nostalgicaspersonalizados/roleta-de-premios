<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roleta Nostálgicas</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body { background: #faedcd; text-align: center; font-family: 'Segoe UI', Tahoma, sans-serif; color: #463f3a; padding: 20px; }
        .box { background: white; max-width: 400px; margin: 0 auto; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        input { padding: 12px; width: 80%; border: 2px solid #d4a373; border-radius: 8px; font-size: 16px; margin-bottom: 10px; }
        #canvas { background: white; border-radius: 50%; border: 8px solid #463f3a; transition: transform 4s cubic-bezier(0.1, 0, 0.2, 1); margin: 20px 0; }
        .pointer { width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid red; margin: 0 auto -25px auto; position: relative; z-index: 10; }
        button { padding: 15px 30px; font-size: 18px; font-weight: bold; background: #bc6c25; color: white; border: none; border-radius: 25px; cursor: pointer; }
        #result { display: none; margin-top: 20px; border-top: 2px dashed #ccc; padding-top: 15px; }
        .wa-btn { display: inline-block; margin-top: 10px; padding: 10px 20px; background: #25d366; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

<div class="box">
    <h2>Nostálgicas Personalizados</h2>
    <p>Para começar, digite o número do seu pedido:</p>
    
    <input type="text" id="numPedido" placeholder="Ex: 1234">
    <br>
    
    <div id="areaRoleta" style="display:none;">
        <div class="pointer"></div>
        <canvas id="canvas" width="400" height="400" style="max-width: 100%; height: auto;"></canvas>
        <br>
        <button id="spinBtn" onclick="girar()">GIRAR ROLETA</button>
    </div>

    <button id="btnValidar" onclick="validarPedido()">LIBERAR ROLETA</button>

    <div id="result">
        <h3 id="prizeText" style="color: #bc6c25;"></h3>
        <p>Tire um print desta tela ou clique abaixo:</p>
        <a id="waLink" href="#" class="wa-btn" target="_blank">Enviar prêmio para WhatsApp</a>
    </div>
</div>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const premios = ["Cupom Indicação", "15% de Desconto", "Mini Álbum", "R$ 10 OFF", "Frete Grátis"];
    const cores = ["#d4a373", "#ccd5ae", "#e9edc9", "#faedcd", "#bc6c25"];
    let anguloAtual = 0;

    function desenhar() {
        const fatia = (2 * Math.PI) / 5;
        for (let i = 0; i < 5; i++) {
            ctx.beginPath();
            ctx.fillStyle = cores[i];
            ctx.moveTo(200, 200);
            ctx.arc(200, 200, 200, i * fatia, (i + 1) * fatia);
            ctx.fill();
            ctx.stroke();
            ctx.save();
            ctx.translate(200, 200);
            ctx.rotate(i * fatia + fatia / 2);
            ctx.fillStyle = "#463f3a";
            ctx.font = "bold 16px Arial";
            ctx.textAlign = "right";
            ctx.fillText(premios[i], 180, 5);
            ctx.restore();
        }
    }

    function validarPedido() {
        const pedido = document.getElementById("numPedido").value;
        if (pedido.length < 2) {
            alert("Por favor, digite um número de pedido válido.");
            return;
        }
        document.getElementById("areaRoleta").style.display = "block";
        document.getElementById("btnValidar").style.display = "none";
        document.getElementById("numPedido").disabled = true;
        desenhar();
    }

    function girar() {
        document.getElementById("spinBtn").disabled = true;
        const sorteio = Math.floor(Math.random() * 360) + 1800; // Mínimo 5 voltas
        anguloAtual += sorteio;
        
        canvas.style.transform = `rotate(${anguloAtual}deg)`;

        setTimeout(() => {
            const finalDeg = (anguloAtual % 360);
            // Ajuste para o ponteiro no topo
            const prizeIndex = Math.floor(((360 - finalDeg + 270) % 360) / 72);
            const ganhou = premios[prizeIndex];
            const nPedido = document.getElementById("numPedido").value;

            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });

            document.getElementById("result").style.display = "block";
            document.getElementById("prizeText").innerText = "PARABÉNS! VOCÊ GANHOU: " + ganhou;
            
            const msg = encodeURIComponent(`Olá! Ganhei ${ganhou} na roleta! Meu pedido é o #${nPedido}. Deixe salvo para minha próxima compra!`);
            document.getElementById("waLink").href = `https://wa.me/5591984711618?text=${msg}`;
        }, 4000);
    }
</script>
</body>
</html>
