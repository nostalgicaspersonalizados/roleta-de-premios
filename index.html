<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roleta VIP - Nostálgicas</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { --gold: #bc6c25; --cream: #faedcd; --brown: #463f3a; --tan: #d4a373; }
        body { background: var(--cream); text-align: center; font-family: 'Segoe UI', sans-serif; color: var(--brown); padding: 20px; }
        .box { background: white; max-width: 450px; margin: 0 auto; padding: 30px; border-radius: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); border: 2px solid var(--tan); }
        h2 { color: var(--gold); margin-top: 0; font-size: 1.8rem; }
        label { display: block; text-align: left; margin: 10px 0 5px 30px; font-weight: bold; font-size: 14px; }
        input { padding: 14px; width: 85%; border: 2px solid var(--tan); border-radius: 12px; font-size: 16px; margin-bottom: 15px; outline: none; box-sizing: border-box; }
        .canvas-wrap { position: relative; width: 320px; height: 320px; margin: 25px auto; }
        #canvas { width: 100%; height: 100%; border-radius: 50%; border: 7px solid var(--brown); transition: transform 5s cubic-bezier(0.1, 0, 0.2, 1); background: #fff; }
        .pointer { width: 0; height: 0; border-left: 18px solid transparent; border-right: 18px solid transparent; border-top: 35px solid #e63946; position: absolute; top: -20px; left: 50%; transform: translateX(-50%); z-index: 10; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2)); }
        .btn-main { padding: 18px; width: 90%; font-size: 18px; font-weight: bold; background: var(--gold); color: white; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 0 #8a4a16; transition: 0.2s; }
        .btn-main:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }
        #result { display: none; margin-top: 25px; border-top: 3px dashed var(--tan); padding-top: 20px; }
        .wa-btn { display: inline-block; margin-top: 15px; padding: 15px; background: #25d366; color: white; text-decoration: none; border-radius: 12px; font-weight: bold; width: 85%; font-size: 17px; }
    </style>
</head>
<body>

<div class="box">
    <h2>Nostálgicas</h2>
    <div id="formInicial">
        <label>Número do Pedido:</label>
        <input type="text" id="numPedido" placeholder="Ex: 1020">
        <label>Seu próximo desejo na loja:</label>
        <input type="text" id="proximoDesejo" placeholder="Ex: Caneca, Álbum...">
        <button class="btn-main" onclick="validarForm()">LIBERAR MEU GIRO</button>
    </div>
    
    <div id="areaRoleta" style="display:none;">
        <div class="canvas-wrap">
            <div class="pointer"></div>
            <canvas id="canvas" width="500" height="500"></canvas>
        </div>
        <button id="spinBtn" class="btn-main" onclick="girar()">GIRAR AGORA!</button>
    </div>

    <div id="result">
        <h3 id="prizeText" style="color: var(--gold); font-size: 22px; margin: 5px 0;"></h3>
        <p id="prizeInfo" style="font-size: 15px; color: #555;"></p>
        <a id="waLink" href="#" class="wa-btn" target="_blank">Resgatar no WhatsApp</a>
    </div>
</div>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    
    const premiosData = [
        { name: "Cupom Indicação", chance: 45, color: "#d4a373", desc: "Ganhe 10% e dê 10% para um amigo!" },
        { name: "15% de Desconto", chance: 30, color: "#ccd5ae", desc: "Desconto especial para você usar!" },
        { name: "R$ 10 OFF",       chance: 18, color: "#faedcd", desc: "Desconto fixo no valor total." },
        { name: "Mini Álbum",      chance: 5,  color: "#bc6c25", desc: "Um Chuveirinho de 10 fotos de presente!" },
        { name: "Frete Grátis",    chance: 2,  color: "#e9edc9", desc: "Sua próxima entrega é por nossa conta!" }
    ];

    let anguloAcumulado = 0;

    function draw() {
        const fatia = (2 * Math.PI) / 5;
        ctx.clearRect(0, 0, 500, 500);
        
        for (let i = 0; i < 5; i++) {
            // Desenhar Fatia
            ctx.save();
            ctx.beginPath();
            ctx.fillStyle = premiosData[i].color;
            ctx.moveTo(250, 250);
            ctx.arc(250, 250, 250, i * fatia - Math.PI/2, (i + 1) * fatia - Math.PI/2);
            ctx.fill();
            ctx.strokeStyle = "#463f3a";
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();

            // Desenhar Texto
            ctx.save();
            ctx.translate(250, 250);
            ctx.rotate(i * fatia); // Alinhado com o início da fatia
            ctx.rotate(fatia / 2); // Rotaciona para o meio da fatia
            ctx.rotate(-Math.PI / 2); // Ajuste para o topo (12h)
            
            ctx.fillStyle = "#463f3a";
            ctx.textAlign = "right";
            ctx.font = "bold 20px Arial";
            ctx.fillText(premiosData[i].name, 230, 8);
            ctx.restore();
        }
    }

    function validarForm() {
        const pedido = document.getElementById("numPedido").value;
        const desejo = document.getElementById("proximoDesejo").value;
        if (pedido.length < 1 || desejo.length < 2) return alert("Preencha todos os campos!");
        document.getElementById("formInicial").style.display = "none";
        document.getElementById("areaRoleta").style.display = "block";
        draw();
    }

    function girar() {
        const btn = document.getElementById("spinBtn");
        btn.disabled = true;

        const random = Math.random() * 100;
        let acumulado = 0;
        let sorteadoIndex = 0;
        for (let i = 0; i < premiosData.length; i++) {
            acumulado += premiosData[i].chance;
            if (random <= acumulado) { sorteadoIndex = i; break; }
        }

        const grausFatia = 360 / 5;
        const anguloSorteado = 360 - (sorteadoIndex * grausFatia);
        const giroFinal = 2880 + anguloSorteado - (grausFatia / 2);
        anguloAcumulado += giroFinal;
        
        canvas.style.transform = `rotate(${anguloAcumulado}deg)`;

        setTimeout(() => {
            const ganhou = premiosData[sorteadoIndex];
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            document.getElementById("result").style.display = "block";
            document.getElementById("prizeText").innerText = "GANHOU: " + ganhou.name;
            document.getElementById("prizeInfo").innerText = ganhou.desc;
            
            const whatsapp = "559184711618"; 
            const texto = encodeURIComponent(`Olá! Ganhei [${ganhou.name}] na Roleta Nostálgicas!\n\nPedido: #${document.getElementById("numPedido").value}\nDesejo: ${document.getElementById("proximoDesejo").value}`);
            document.getElementById("waLink").href = "https://api.whatsapp.com/send?phone=" + whatsapp + "&text=" + texto;
            btn.innerText = "GIRO CONCLUÍDO!";
        }, 5100);
    }
</script>
</body>
</html>
