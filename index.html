<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roleta VIP - Nostálgicas</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root { 
            --gold: #b07d62;    /* Tom terroso elegante */
            --cream: #fdfaf7;   /* Fundo off-white clean */
            --brown: #4a3f35;   /* Texto café escuro */
            --tan: #d6ccc2;     /* Bordas suaves */
            --accent: #bc6c25;  /* Destaque artesanal */
        }
        body { 
            background: var(--cream); 
            background-image: radial-gradient(var(--tan) 0.5px, transparent 0.5px);
            background-size: 20px 20px; 
            text-align: center; 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            color: var(--brown); 
            padding: 20px; 
            margin: 0;
        }
        .box { 
            background: white; 
            max-width: 420px; 
            margin: 20px auto; 
            padding: 40px 20px; 
            border-radius: 30px; 
            box-shadow: 0 15px 35px rgba(74,63,53,0.08); 
            border: 1px solid var(--tan); 
        }
        h2 { color: var(--accent); font-size: 2rem; margin-bottom: 5px; letter-spacing: -1px; }
        .subtitle { font-size: 13px; color: var(--gold); margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
        label { display: block; text-align: left; margin: 15px 0 5px 35px; font-weight: 600; font-size: 12px; color: var(--brown); }
        input { 
            padding: 15px; width: 85%; border: 1.5px solid var(--tan); border-radius: 15px; 
            font-size: 16px; margin-bottom: 10px; outline: none; transition: 0.3s; box-sizing: border-box;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(188,108,37,0.1); }
        .btn-main { 
            padding: 18px; width: 90%; font-size: 17px; font-weight: bold; background: var(--accent); 
            color: white; border: none; border-radius: 50px; cursor: pointer; transition: 0.3s; margin-top: 15px;
        }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 8px 15px rgba(188,108,37,0.2); }
        .btn-main:disabled { background: #ccc; cursor: not-allowed; transform: none; }

        /* Estilo da Roleta */
        .canvas-wrap { position: relative; width: 320px; height: 320px; margin: 30px auto; }
        #canvas { width: 100%; height: 100%; border-radius: 50%; border: 8px solid var(--brown); transition: transform 5s cubic-bezier(0.1, 0, 0.2, 1); background: #fff; }
        .pointer { width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid #e63946; position: absolute; top: -15px; left: 50%; transform: translateX(-50%); z-index: 10; }
        
        #result { display: none; margin-top: 25px; border-top: 2px dashed var(--tan); padding-top: 20px; animation: fadeInUp 0.6s ease; }
        .wa-btn { display: inline-block; margin-top: 15px; padding: 16px; background: #25d366; color: white; text-decoration: none; border-radius: 15px; font-weight: bold; width: 85%; font-size: 16px; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="box">
    <h2>Nostálgicas</h2>
    <p class="subtitle">Presentes com Memória</p>

    <div id="formInicial">
        <label>NÚMERO DO PEDIDO:</label>
        <input type="text" id="numPedido" placeholder="Digite aqui...">
        <label>O QUE VOCÊ DESEJA COMPRAR DEPOIS?</label>
        <input type="text" id="proximoDesejo" placeholder="Ex: Caneca, Álbum, Quadro...">
        <button class="btn-main" onclick="validarForm()">LIBERAR MEU GIRO</button>
    </div>
    
    <div id="areaRoleta" style="display:none;">
        <div class="canvas-wrap">
            <div class="pointer"></div>
            <canvas id="canvas" width="500" height="500"></canvas>
        </div>
        <button id="spinBtn" class="btn-main" onclick="girar()">GIRAR A ROLETA!</button>
    </div>

    <div id="result">
        <h3 id="prizeText" style="color: var(--accent); font-size: 24px; margin: 5px 0;"></h3>
        <p id="prizeInfo" style="font-size: 15px; color: #666; margin-bottom: 20px;"></p>
        <a id="waLink" href="#" class="wa-btn" target="_blank">RESGATAR NO WHATSAPP</a>
    </div>
</div>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    
    const premiosData = [
        { name: "Cupom Indicação", chance: 45, color: "#d6ccc2", desc: "Ganhe 10% e dê 10% para um amigo!" },
        { name: "15% de Desconto", chance: 30, color: "#edede9", desc: "Desconto especial para você usar!" },
        { name: "R$ 10 OFF",       chance: 18, color: "#f5ebe0", desc: "Desconto fixo no valor total." },
        { name: "Mini Álbum",      chance: 5,  color: "#d5bdaf", desc: "Um Chuveirinho de 10 fotos de presente!" },
        { name: "Frete Grátis",    chance: 2,  color: "#e3d5ca", desc: "Sua próxima entrega é por nossa conta!" }
    ];

    let anguloAcumulado = 0;

    function draw() {
        const fatia = (2 * Math.PI) / 5;
        ctx.clearRect(0, 0, 500, 500);
        for (let i = 0; i < 5; i++) {
            ctx.save();
            ctx.beginPath();
            ctx.fillStyle = premiosData[i].color;
            ctx.moveTo(250, 250);
            ctx.arc(250, 250, 250, i * fatia - Math.PI/2, (i + 1) * fatia - Math.PI/2);
            ctx.fill();
            ctx.strokeStyle = "#4a3f35";
            ctx.lineWidth = 1;
            ctx.stroke();
            ctx.restore();

            ctx.save();
            ctx.translate(250, 250);
            ctx.rotate(i * fatia + fatia / 2 - Math.PI / 2);
            ctx.fillStyle = "#4a3f35";
            ctx.textAlign = "right";
            ctx.font = "bold 20px Arial";
            ctx.fillText(premiosData[i].name, 230, 8);
            ctx.restore();
        }
    }

    function validarForm() {
        const p = document.getElementById("numPedido").value;
        const d = document.getElementById("proximoDesejo").value;
        if (p.length < 1 || d.length < 2) return alert("Por favor, preencha os campos para girar!");
        document.getElementById("formInicial").style.display = "none";
        document.getElementById("areaRoleta").style.display = "block";
        draw();
    }

    function girar() {
        const btn = document.getElementById("spinBtn");
        btn.disabled = true;

        const random = Math.random() * 100;
        let acumulado = 0;
        let sorteadoIndex = 0;
        for (let i = 0; i < premiosData.length; i++) {
            acumulado += premiosData[i].chance;
            if (random <= acumulado) { sorteadoIndex = i; break; }
        }

        const grausFatia = 360 / 5;
        const anguloSorteado = 360 - (sorteadoIndex * grausFatia);
        const giroFinal = 2880 + anguloSorteado - (grausFatia / 2);
        anguloAcumulado += giroFinal;
        canvas.style.transform = `rotate(${anguloAcumulado}deg)`;

        // --- ENVIO PARA A PLANILHA ---
        const urlPlanilha = "https://script.google.com/macros/s/AKfycbzKQgkHJv93MAL70X4k3MjNmCxN1GEJuK4u6bIrn22adQUGuvZTVvMBUmZCHbNDC_g/exec";
        
        fetch(urlPlanilha, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify({
                pedido: document.getElementById("numPedido").value,
                desejo: document.getElementById("proximoDesejo").value,
                premio: premiosData[sorteadoIndex].name
            })
        });

        setTimeout(() => {
            const ganhou = premiosData[sorteadoIndex];
