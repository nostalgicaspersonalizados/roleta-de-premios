<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roleta VIP - Nostálgicas</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --azul-escuro: #300870;
            --branco: #fefefe;
            --amarelo: #faea60;
            --dourado: #ffb11b;
            --roxo-logo: #8c52ff;
            --gradiente-premio: linear-gradient(135deg, #8c52ff 0%, #ffb11b 100%);
        }

        body { 
            background: #f4f4f4 url('fundotema.png') no-repeat center center fixed; 
            background-size: cover;
            text-align: center; 
            font-family: 'Poppins', sans-serif;
            margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh;
        }

        .box { 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); 
            max-width: 420px; width: 90%; padding: 30px 20px; border-radius: 40px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.4); 
        }

        .logo-container img { max-width: 150px; height: auto; margin-bottom: 5px; }
        .subtitle { font-family: 'Dancing Script', cursive; font-size: 22px; color: var(--roxo-logo); margin: 0 0 20px 0; }
        
        #formInicial label { display: block; text-align: left; margin: 10px 0 3px 20px; font-weight: 600; font-size: 10px; color: var(--azul-escuro); text-transform: uppercase; }
        #formInicial input[type="text"] { padding: 12px; width: 90%; border: 2px solid rgba(0,0,0,0.05); border-radius: 15px; font-size: 15px; margin-bottom: 8px; outline: none; box-sizing: border-box; }

        .lgpd-container { display: flex; align-items: center; margin: 10px 15px; gap: 8px; text-align: left; }
        .lgpd-container label { font-size: 9px; color: #666; }

        .btn-main { padding: 18px; width: 90%; font-size: 16px; font-weight: 800; background: linear-gradient(135deg, var(--roxo-logo), #6a32cc); color: white; border: none; border-radius: 18px; cursor: pointer; text-transform: uppercase; }

        .canvas-wrap { position: relative; width: 280px; height: 280px; margin: 20px auto; }
        #canvas { width: 100%; height: 100%; border-radius: 50%; border: 8px solid var(--azul-escuro); transition: transform 5s cubic-bezier(0.1, 0, 0.2, 1); background: #fff; }
        .pointer { width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid var(--dourado); position: absolute; top: -10px; left: 50%; transform: translateX(-50%); z-index: 10; }
        
        #result { display: none; margin-top: 20px; border-top: 3px solid var(--amarelo); padding-top: 20px; }
        .premio-card { background: var(--gradiente-premio); border-radius: 20px; padding: 20px; margin-bottom: 15px; border: 2px solid var(--dourado); color: white; }
        #prizeText { font-size: 24px; font-weight: 800; margin: 0; }
        #prizeInfo { font-size: 13px; margin-top: 5px; }

        #campoIndicado { display: none; margin-top: 15px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.3); }
        #nomeAmigo { padding: 10px; width: 100%; border-radius: 10px; border: none; margin-top: 5px; text-align: center; font-weight: 600; }

        .wa-btn { display: inline-block; padding: 18px; background: #25d366; color: white; text-decoration: none; border-radius: 18px; font-weight: 800; width: 90%; text-transform: uppercase; margin-top: 10px; font-size: 13px; }
    </style>
</head>
<body>

<div class="box">
    <div class="logo-container"><img src="NOSTÁLGICAS (1).png" alt="Logo"></div>
    <p class="subtitle">Arte, Lembranças e amor</p>

    <div id="formInicial">
        <label>COMO PODEMOS TE CHAMAR?</label>
        <input type="text" id="nomeCliente" placeholder="Seu nome">
        <label>NÚMERO DO PEDIDO:</label>
        <input type="text" id="numPedido" placeholder="Digite o número...">
        <label>PRÓXIMO DESEJO:</label>
        <input type="text" id="proximoDesejo" placeholder="O que quer ganhar?">
        <div class="lgpd-container">
            <input type="checkbox" id="checkLGPD">
            <label for="checkLGPD">Aceito os termos de sorteio.</label>
        </div>
        <button class="btn-main" onclick="validarForm()">LIBERAR MEU GIRO</button>
    </div>
    
    <div id="areaRoleta" style="display:none;">
        <div class="canvas-wrap">
            <div class="pointer"></div>
            <canvas id="canvas" width="500" height="500"></canvas>
        </div>
        <button id="spinBtn" class="btn-main" onclick="girar()">GIRAR AGORA!</button>
    </div>

    <div id="result">
        <div class="premio-card">
            <span id="premioIcone" style="font-size:40px">🏆</span>
            <h3 id="prizeText"></h3>
            <p id="prizeInfo"></p>
            <div id="campoIndicado">
                <label style="color:white; font-size:11px">NOME DO AMIGO(A):</label>
                <input type="text" id="nomeAmigo" placeholder="Nome dele(a)" oninput="atualizarLinkZap()">
            </div>
        </div>
        <a id="waLink" href="#" class="wa-btn" target="_blank" onclick="proximoPassoIndica()">1º PASSO: ME AVISE NO WHATSAPP</a>
    </div>
</div>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const premiosData = [
        { name: "Cupom Indicação", chance: 45, color: "#faea60", icone: "🎁", desc: "10% para um amigo e 10% para você após o pedido dele!" },
        { name: "15% de Desconto", chance: 30, color: "#8c52ff", icone: "🎉", desc: "Use na sua próxima compra!" },
        { name: "R$ 10 OFF",       chance: 18, color: "#ffb11b", icone: "💰", desc: "Desconto direto no valor total." },
        { name: "Mini Álbum",      chance: 5,  color: "#300870", icone: "📸", desc: "Um chaveirinho de brinde!" },
        { name: "Frete Grátis",    chance: 2,  color: "#fefefe", icone: "🚚", desc: "Entrega grátis no próximo pedido!" }
    ];

    let anguloAcumulado = 0;
    let passoIndica = 1;

    window.onload = function() {
        try {
            const salvo = localStorage.getItem("nostalgicas_vFinal_vFIX");
            if (salvo) { exibirResultadoFinal(JSON.parse(salvo)); }
        } catch (e) {}
    };

    function draw() {
        const fatia = (2 * Math.PI) / 5;
        ctx.clearRect(0, 0, 500, 500);
        for (let i = 0; i < 5; i++) {
            ctx.save(); ctx.beginPath(); ctx.fillStyle = premiosData[i].color;
            ctx.moveTo(250, 250); ctx.arc(250, 250, 250, i * fatia - Math.PI/2, (i + 1) * fatia - Math.PI/2);
            ctx.fill(); ctx.stroke(); ctx.restore();
            ctx.save(); ctx.translate(250, 250); ctx.rotate(i * fatia + fatia / 2 - Math.PI / 2);
            ctx.fillStyle = (i === 1 || i === 3) ? "#ffffff" : "#300870"; 
            ctx.textAlign = "right"; ctx.font = "bold 22px Arial"; ctx.fillText(premiosData[i].name, 230, 8); ctx.restore();
        }
    }

    function validarForm() {
        const n = document.getElementById("nomeCliente").value;
        const p = document.getElementById("numPedido").value;
        if (n.length < 2 || p.length < 1) { alert("Preencha nome e pedido!"); return; }
        document.getElementById("formInicial").style.display = "none";
        document.getElementById("areaRoleta").style.display = "block";
        draw();
    }

    function girar() {
        const btn = document.getElementById("spinBtn");
        btn.disabled = true; btn.innerText = "SORTEANDO...";

        const random = Math.random() * 100;
        let acumulado = 0; let sorteadoIndex = 0;
        for (let i = 0; i < premiosData.length; i++) {
            acumulado += premiosData[i].chance;
            if (random <= acumulado) { sorteadoIndex = i; break; }
        }

        const grausFatia = 360 / 5;
        const anguloSorteado = 360 - (sorteadoIndex * grausFatia);
        anguloAcumulado += (3600 + anguloSorteado - (grausFatia / 2));
        canvas.style.transform = `rotate(${anguloAcumulado}deg)`;

        const objGanhador = {
            nome: document.getElementById("nomeCliente").value,
            pedido: document.getElementById("numPedido").value,
            desejo: document.getElementById("proximoDesejo").value,
            premio: premiosData[sorteadoIndex].name,
            desc: premiosData[sorteadoIndex].desc,
            icone: premiosData[sorteadoIndex].icone
        };

        localStorage.setItem("nostalgicas_vFinal_vFIX", JSON.stringify(objGanhador));

        // Tenta enviar para a planilha mas não trava se falhar
        try {
            fetch("https://script.google.com/macros/s/AKfycbw6Btaxwl4P257YG-_0mGOsSeUNVDGz6NfXRgvD-Jfk-CBE7ikRwIhWMdO-BbdoMyp1Rg/exec", {
                method: "POST", mode: "no-cors",
                body: JSON.stringify(objGanhador)
            });
        } catch(e) { console.log("Erro planilha"); }

        setTimeout(() => {
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.7 } });
            exibirResultadoFinal(objGanhador);
        }, 5100);
    }

    function exibirResultadoFinal(dados) {
        document.getElementById("formInicial").style.display = "none";
        document.getElementById("areaRoleta").style.display = "none";
        document.getElementById("result").style.display = "block";
        document.getElementById("prizeText").innerText = dados.premio;
        document.getElementById("prizeInfo").innerText = dados.desc;
        document.getElementById("premioIcone").innerText = dados.icone;
        if (dados.premio === "Cupom Indicação") document.getElementById("campoIndicado").style.display = "block";
        atualizarLinkZap();
    }

    function proximoPassoIndica() {
        const d = JSON.parse(localStorage.getItem("nostalgicas_vFinal_vFIX"));
        if (d.premio === "Cupom Indicação" && passoIndica === 1) {
            setTimeout(() => {
                passoIndica = 2;
                const btn = document.getElementById("waLink");
                btn.innerText = "2º PASSO: ENVIAR PRESENTE";
                btn.style.background = "#007bff";
                atualizarLinkZap();
            }, 1000);
        }
    }

    function atualizarLinkZap() {
        const d = JSON.parse(localStorage.getItem("nostalgicas_vFinal_vFIX"));
        const amigo = document.getElementById("nomeAmigo").value || "______";
        const btn = document.getElementById("waLink");
        
        if (passoIndica === 1) {
            let msg = `Olá! Sou ${d.nome} e ganhei ${d.premio}!\nPedido: #${d.pedido}\nDesejo: ${d.desejo}`;
            if(d.premio === "Cupom Indicação") msg += `\nIndicado: ${amigo}`;
            btn.href = `https://wa.me/message/U5MVBCCYBHLMF1?text=${encodeURIComponent(msg)}`;
        } else {
            let msgAmigo = `Oi, ${amigo}! Ganhei um presente na Nostálgicas e escolhi você para ganhar 10% de desconto também! 🎁\nVeja aqui: https://www.instagram.com/nostalgicas.personalizados/`;
            btn.href = `https://wa.me/?text=${encodeURIComponent(msgAmigo)}`;
        }
    }
</script>
</body>
</html>
