<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    
    const premiosData = [
        { name: "Cupom Indicação", chance: 45, color: "#faea60", desc: "Ganhe 10% e dê 10% para um amigo!" },
        { name: "15% de Desconto", chance: 30, color: "#8c52ff", desc: "Desconto especial para você usar!" },
        { name: "R$ 10 OFF",       chance: 18, color: "#ffb11b", desc: "Desconto fixo no valor total." },
        { name: "Mini Álbum",      chance: 5,  color: "#300870", desc: "Um Chuveirinho de 10 fotos de presente!" },
        { name: "Frete Grátis",    chance: 2,  color: "#fefefe", desc: "Sua próxima entrega é por nossa conta!" }
    ];

    let anguloAcumulado = 0;

    // --- VERIFICADOR DE GIRO (NOVIDADE) ---
    window.onload = function() {
        const jaGirou = localStorage.getItem("nostalgicas_ganhou");
        if (jaGirou) {
            exibirResultadoFinal(JSON.parse(jaGirou));
            document.getElementById("formInicial").style.display = "none";
        }
    };

    function draw() {
        const fatia = (2 * Math.PI) / 5;
        ctx.clearRect(0, 0, 500, 500);
        for (let i = 0; i < 5; i++) {
            ctx.save();
            ctx.beginPath();
            ctx.fillStyle = premiosData[i].color;
            ctx.moveTo(250, 250);
            ctx.arc(250, 250, 250, i * fatia - Math.PI/2, (i + 1) * fatia - Math.PI/2);
            ctx.fill();
            ctx.strokeStyle = "#300870";
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.restore();

            ctx.save();
            ctx.translate(250, 250);
            ctx.rotate(i * fatia + fatia / 2 - Math.PI / 2);
            ctx.fillStyle = (i === 1 || i === 3) ? "#ffffff" : "#300870"; 
            ctx.textAlign = "right";
            ctx.font = "bold 22px Arial";
            ctx.fillText(premiosData[i].name, 230, 8);
            ctx.restore();
        }
    }

    function validarForm() {
        if (localStorage.getItem("nostalgicas_ganhou")) return;
        const p = document.getElementById("numPedido").value;
        const d = document.getElementById("proximoDesejo").value;
        if (p.length < 1 || d.length < 2) return alert("Preencha os campos para girar!");
        document.getElementById("formInicial").style.display = "none";
        document.getElementById("areaRoleta").style.display = "block";
        draw();
    }

    function girar() {
        const btn = document.getElementById("spinBtn");
        btn.disabled = true;

        const random = Math.random() * 100;
        let acumulado = 0;
        let sorteadoIndex = 0;
        for (let i = 0; i < premiosData.length; i++) {
            acumulado += premiosData[i].chance;
            if (random <= acumulado) { sorteadoIndex = i; break; }
        }

        const grausFatia = 360 / 5;
        const anguloSorteado = 360 - (sorteadoIndex * grausFatia);
        const giroFinal = 2880 + anguloSorteado - (grausFatia / 2);
        anguloAcumulado += giroFinal;
        canvas.style.transform = `rotate(${anguloAcumulado}deg)`;

        const dadosGanhador = {
            pedido: document.getElementById("numPedido").value,
            desejo: document.getElementById("proximoDesejo").value,
            premio: premiosData[sorteadoIndex].name,
            desc: premiosData[sorteadoIndex].desc
        };

        // SALVA NA MEMÓRIA DO CELULAR DO CLIENTE
        localStorage.setItem("nostalgicas_ganhou", JSON.stringify(dadosGanhador));

        // ENVIA PARA A PLANILHA
        const urlPlanilha = "https://script.google.com/macros/s/AKfycbw6Btaxwl4P257YG-_0mGOsSeUNVDGz6NfXRgvD-Jfk-CBE7ikRwIhWMdO-BbdoMyp1Rg/exec";
        fetch(urlPlanilha, { method: "POST", mode: "no-cors", body: JSON.stringify(dadosGanhador) });

        setTimeout(() => {
            confetti({ particleCount: 200, spread: 90, origin: { y: 0.7 }, colors: ['#8c52ff', '#ffb11b', '#faea60'] });
            exibirResultadoFinal(dadosGanhador);
        }, 5100);
    }

    function exibirResultadoFinal(dados) {
        document.getElementById("areaRoleta").style.display = "none";
        const resDiv = document.getElementById("result");
        resDiv.style.display = "block";
        document.getElementById("prizeText").innerText = "VOCÊ GANHOU: " + dados.premio;
        document.getElementById("prizeInfo").innerText = dados.desc;
        
        const whatsapp = "559184711618"; 
        const texto = encodeURIComponent(`Olá! Sou cliente Nostálgicas e já ganhei [${dados.premio}] na Roleta!\n\nPedido: #${dados.pedido}\nMeu próximo desejo é: ${dados.desejo}`);
        document.getElementById("waLink").href = "https://api.whatsapp.com/send?phone=" + whatsapp + "&text=" + texto;
    }
</script>
