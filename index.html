<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roleta VIP - Nostálgicas</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --azul-escuro: #300870;
            --roxo-logo: #8c52ff;
            --amarelo: #faea60;
            --dourado: #ffb11b;
            --gradiente-premio: linear-gradient(135deg, #8c52ff 0%, #ffb11b 100%);
        }

        body { 
            background: #f4f4f4 url('fundotema.png') no-repeat center center fixed; 
            background-size: cover; text-align: center; font-family: 'Poppins', sans-serif;
            margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh;
        }

        .box { 
            background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            max-width: 420px; width: 90%; padding: 35px 25px; border-radius: 40px; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.4); 
            box-sizing: border-box;
        }

        .logo-container img { max-width: 160px; margin-bottom: 5px; }
        .subtitle { font-family: 'Dancing Script', cursive; font-size: 24px; color: var(--roxo-logo); margin-bottom: 25px; font-weight: 700; }
        
        #formInicial label { display: block; text-align: left; margin: 12px 0 4px 25px; font-weight: 600; font-size: 11px; color: var(--azul-escuro); text-transform: uppercase; letter-spacing: 1px; }
        #formInicial input { padding: 15px; width: 90%; border: 2px solid rgba(0,0,0,0.05); border-radius: 18px; margin-bottom: 8px; outline: none; box-sizing: border-box; background: rgba(255,255,255,0.9); }

        .lgpd-container { display: flex; align-items: flex-start; justify-content: center; margin: 15px 10px; gap: 10px; text-align: left; }
        .lgpd-container input { margin-top: 4px; transform: scale(1.3); cursor: pointer; }
        .lgpd-container label { margin: 0; font-size: 10px; color: #555; line-height: 1.4; cursor: pointer; }

        .btn-main { padding: 20px; width: 90%; font-size: 18px; font-weight: 800; background: linear-gradient(135deg, var(--roxo-logo), #6a32cc); color: white; border: none; border-radius: 20px; cursor: pointer; text-transform: uppercase; box-shadow: 0 10px 25px rgba(140,82,255,0.4); }

        .canvas-wrap { position: relative; width: 280px; height: 280px; margin: 25px auto; }
        #canvas { width: 100%; height: 100%; border-radius: 50%; border: 10px solid var(--azul-escuro); transition: transform 5s cubic-bezier(0.1, 0, 0.2, 1); background: #fff; }
        .pointer { width: 0; height: 0; border-left: 18px solid transparent; border-right: 18px solid transparent; border-top: 35px solid var(--dourado); position: absolute; top: -15px; left: 50%; transform: translateX(-50%); z-index: 10; }
        
        #result { display: none; margin-top: 20px; padding-top: 25px; border-top: 4px solid var(--amarelo); animation: slideUp 0.6s ease-out; }
        .premio-card { background: var(--gradiente-premio); border-radius: 30px; padding: 30px 20px; margin-bottom: 20px; border: 3px solid var(--dourado); color: white; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        
        #campoIndicado { display: none; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.3); padding-top: 20px; }
        #nomeAmigo { padding: 15px; width: 100%; border-radius: 15px; border: none; text-align: center; font-weight: 700; outline: none; background: #fff; color: var(--azul-escuro); }

        .wa-btn { display: inline-block; padding: 22px; background: #25d366; color: white; text-decoration: none; border-radius: 22px; font-weight: 800; width: 90%; text-transform: uppercase; font-size: 13px; box-shadow: 0 10px 25px rgba(37,211,102,0.4); transition: 0.3s; }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="box">
    <div class="logo-container"><img src="NOSTÁLGICAS (1).png" alt="Logo Nostálgicas"></div>
    <p class="subtitle">Arte, Lembranças e Amor</p>

    <div id="formInicial">
        <label>COMO PODEMOS TE CHAMAR?</label>
        <input type="text" id="nomeCliente" placeholder="Seu nome">
        <label>NÚMERO DO PEDIDO:</label>
        <input type="text" id="numPedido" placeholder="Digite o número...">
        <label>PRÓXIMO DESEJO:</label>
        <input type="text" id="proximoDesejo" placeholder="O que pretende comprar?">
        
        <div class="lgpd-container">
            <input type="checkbox" id="checkLGPD">
            <label for="checkLGPD">Autorizo o uso dos meus dados pela Nostálgicas para fins de sorteio e contato conforme a LGPD.</label>
        </div>
        
        <button class="btn-main" onclick="validarForm()">LIBERAR MEU GIRO</button>
    </div>
    
    <div id="areaRoleta" style="display:none;">
        <div class="canvas-wrap"><div class="pointer"></div><canvas id="canvas" width="500" height="500"></canvas></div>
        <button id="spinBtn" class="btn-main" onclick="girar()">GIRAR AGORA!</button>
    </div>

    <div id="result">
        <div class="premio-card">
            <span id="premioIcone" style="font-size:55px; display:block; margin-bottom:15px;">🏆</span>
            <h3 id="prizeText"></h3>
            <p id="prizeInfo"></p>
            <div id="campoIndicado">
                <label style="font-weight: 800; font-size: 12px; margin-bottom: 8px; display: block; color: white;">NOME DO AMIGO(A) INDICADO:</label>
                <input type="text" id="nomeAmigo" placeholder="Quem ganhará?" oninput="atualizarLinkFinal()">
            </div>
        </div>
        <a id="waLinkFinal" href="#" class="wa-btn" target="_blank" onclick="return verificarAcao(event)">1º PASSO: VALIDAR NO WHATSAPP</a>
        <p id="instrucaoPasso" style="font-size: 11px; font-weight: 600; margin-top: 15px; color: var(--azul-escuro);">Você precisa nos avisar para validarmos o prêmio.</p>
    </div>
</div>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwE_tE3kWqeqbcxCayZ-es9uekROLlP27UeiYNH_39thbc3cjeLGUFrJm74CslsICGuCw/exec';

    const premiosData = [
        { name: "Cupom Indicação", chance: 45, color: "#faea60", icone: "🎁", desc: "Após seu amigo indicado efetuar o primeiro pedido já com desconto você ganhe 10% de desconto no próximo pedido!" },
        { name: "15% de Desconto", chance: 30, color: "#8c52ff", icone: "🎉", desc: "Use na sua próxima compra na Nostálgicas!" },
        { name: "R$ 10 OFF",       chance: 18, color: "#ffb11b", icone: "💰", desc: "Desconto de R$10 no total do seu  próximo pedido." },
        { name: "Mini Álbum",      chance: 5,  color: "#300870", icone: "📸", desc: " No próximo pedido garanta um brinde especial para suas memórias!" },
        { name: "Frete Grátis",    chance: 2,  color: "#fefefe", icone: "🚚", desc: "Sua próxima entrega é por nossa conta!" }
    ];

    let anguloAcumulado = 0;
    let passoGlobal = 1;
    let dadosGanhador = {};

    window.onload = function() {
        const travaReal = localStorage.getItem("nostalgicas_v12_fix");
        if (travaReal) {
            dadosGanhador = JSON.parse(travaReal);
            exibirResultado();
        }
    };

    function draw() {
        const fatia = (2 * Math.PI) / 5;
        ctx.clearRect(0, 0, 500, 500);
        for (let i = 0; i < 5; i++) {
            ctx.save(); ctx.beginPath(); ctx.fillStyle = premiosData[i].color;
            ctx.moveTo(250, 250); ctx.arc(250, 250, 250, i * fatia - Math.PI/2, (i + 1) * fatia - Math.PI/2);
            ctx.fill(); ctx.stroke(); ctx.restore();
            ctx.save(); ctx.translate(250, 250); ctx.rotate(i * fatia + fatia / 2 - Math.PI / 2);
            ctx.fillStyle = (i === 1 || i === 3) ? "#fff" : "#300870"; 
            ctx.textAlign = "right"; ctx.font = "bold 22px Arial"; ctx.fillText(premiosData[i].name, 230, 8); ctx.restore();
        }
    }

    function validarForm() {
        if (document.getElementById("nomeCliente").value.length < 2) { alert("Digite seu nome!"); return; }
        if (!document.getElementById("checkLGPD").checked) { alert("Aceite os termos LGPD."); return; }
        document.getElementById("formInicial").style.display = "none";
        document.getElementById("areaRoleta").style.display = "block";
        draw();
    }

    function girar() {
        document.getElementById("spinBtn").disabled = true;
        const random = Math.random() * 100;
        let acumulado = 0; let sorteadoIndex = 0;
        for (let i = 0; i < premiosData.length; i++) {
            acumulado += premiosData[i].chance;
            if (random <= acumulado) { sorteadoIndex = i; break; }
        }
        anguloAcumulado += (3600 + (360 - (sorteadoIndex * 72)) - 36);
        canvas.style.transform = `rotate(${anguloAcumulado}deg)`;

        // Grava os dados base (sem o nome do amigo ainda)
        dadosGanhador = {
            nome: document.getElementById("nomeCliente").value,
            pedido: document.getElementById("numPedido").value,
            desejo: document.getElementById("proximoDesejo").value,
            premio: premiosData[sorteadoIndex].name,
            desc: premiosData[sorteadoIndex].desc,
            icone: premiosData[sorteadoIndex].icone
        };

        localStorage.setItem("nostalgicas_v12_fix", JSON.stringify(dadosGanhador));

        setTimeout(() => {
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.7 } });
            exibirResultado();
            // Envia para a planilha imediatamente (se não for indicação, já vai certo)
            if (dadosGanhador.premio !== "Cupom Indicação") {
                enviarDadosPlanilha(dadosGanhador);
            }
        }, 5100);
    }

    function enviarDadosPlanilha(dados) {
        // Se for indicação, junta o nome do amigo no campo prêmio antes de enviar
        let dadosParaEnviar = {...dados};
        const nomeAmigoInput = document.getElementById("nomeAmigo").value;
        if (dadosParaEnviar.premio === "Cupom Indicação" && nomeAmigoInput) {
            dadosParaEnviar.premio = "Cupom Indicação - Amigo: " + nomeAmigoInput;
        }

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(dadosParaEnviar)
        }).catch(e => console.log(e));
    }

    function exibirResultado() {
        document.getElementById("formInicial").style.display = "none";
        document.getElementById("areaRoleta").style.display = "none";
        document.getElementById("result").style.display = "block";
        document.getElementById("prizeText").innerText = dadosGanhador.premio;
        document.getElementById("prizeInfo").innerText = dadosGanhador.desc;
        document.getElementById("premioIcone").innerText = dadosGanhador.icone;
        if (dadosGanhador.premio === "Cupom Indicação") {
            document.getElementById("campoIndicado").style.display = "block";
        }
        atualizarLinkFinal();
    }

    function atualizarLinkFinal() {
        const amigo = document.getElementById("nomeAmigo").value || "______";
        const btn = document.getElementById("waLinkFinal");
        
        if (passoGlobal === 1) {
            let texto = `Olá Nostálgicas! Sou ${dadosGanhador.nome} e ganhei ${dadosGanhador.premio}!\n\n📌 *DADOS*:\n👤 Nome: ${dadosGanhador.nome}\n📦 Pedido: #${dadosGanhador.pedido}\n✨ Desejo: ${dadosGanhador.desejo}`;
            if (dadosGanhador.premio === "Cupom Indicação") texto += `\n🎁 Amigo Indicado: ${amigo}`;
            btn.href = `https://api.whatsapp.com/send?phone=5591984711618&text=${encodeURIComponent(texto)}`;
        } else {
            let textoAmigo = `Oi, ${amigo}! Ganhei um presente na Nostálgicas e escolhi você para ganhar 10% de desconto também! 🎁 Acesse o link e garanta já o seu produto com desconto\n\nInstagram: https://www.instagram.com/nostalgicas.personalizados/`;
            btn.href = `https://api.whatsapp.com/send?text=${encodeURIComponent(textoAmigo)}`;
        }
    }

    function verificarAcao(e) {
        if (dadosGanhador.premio === "Cupom Indicação") {
            const nomeAmigoVal = document.getElementById("nomeAmigo").value;
            if (!nomeAmigoVal) {
                alert("Por favor, digite o nome do seu amigo(a)!");
                return false;
            }
            // Envia para a planilha com o nome do amigo agora que ele preencheu
            enviarDadosPlanilha(dadosGanhador);
        }
        
        if (dadosGanhador.premio === "Cupom Indicação" && passoGlobal === 1) {
            setTimeout(() => {
                passoGlobal = 2;
                const btn = document.getElementById("waLinkFinal");
                btn.innerText = "2º PASSO: ENVIAR PARA O AMIGO";
                btn.style.background = "#007bff";
                atualizarLinkFinal();
            }, 1000);
        }
        return true;
    }
</script>
</body>
</html>
