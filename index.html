<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Roleta VIP - Nostálgicas</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --azul-escuro: #300870;
            --roxo-logo: #8c52ff;
            --amarelo: #faea60;
            --dourado: #ffb11b;
            --gradiente-premio: linear-gradient(135deg, #8c52ff 0%, #300870 100%);
        }

        body { 
            background: #f4f4f4 url('fundotema.png') no-repeat center center fixed; 
            background-size: cover; text-align: center; font-family: 'Poppins', sans-serif;
            margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh;
        }

        .box { 
            background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            max-width: 420px; width: 90%; padding: 35px 25px; border-radius: 40px; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.4); 
            box-sizing: border-box;
        }

        .logo-container img { max-width: 160px; margin-bottom: 5px; }
        .subtitle { font-family: 'Dancing Script', cursive; font-size: 24px; color: var(--roxo-logo); margin-bottom: 25px; font-weight: 700; }
        
        #formInicial label { display: block; text-align: left; margin: 12px 0 4px 25px; font-weight: 600; font-size: 11px; color: var(--azul-escuro); text-transform: uppercase; letter-spacing: 1px; }
        #formInicial input { padding: 15px; width: 90%; border: 2px solid rgba(0,0,0,0.05); border-radius: 18px; margin-bottom: 8px; outline: none; box-sizing: border-box; background: rgba(255,255,255,0.9); }

        .lgpd-container { display: flex; align-items: flex-start; justify-content: center; margin: 15px 10px; gap: 10px; text-align: left; }
        .lgpd-container input { margin-top: 4px; transform: scale(1.3); cursor: pointer; }
        .lgpd-container label { margin: 0; font-size: 10px; color: #555; line-height: 1.4; cursor: pointer; }

        .btn-main { padding: 20px; width: 90%; font-size: 18px; font-weight: 800; background: linear-gradient(135deg, var(--roxo-logo), #6a32cc); color: white; border: none; border-radius: 20px; cursor: pointer; text-transform: uppercase; box-shadow: 0 10px 25px rgba(140,82,255,0.4); }

        .canvas-wrap { position: relative; width: 280px; height: 280px; margin: 25px auto; }
        #canvas { width: 100%; height: 100%; border-radius: 50%; border: 10px solid var(--azul-escuro); transition: transform 5s cubic-bezier(0.1, 0, 0.2, 1); background: #fff; }
        .pointer { width: 0; height: 0; border-left: 18px solid transparent; border-right: 18px solid transparent; border-top: 35px solid var(--dourado); position: absolute; top: -15px; left: 50%; transform: translateX(-50%); z-index: 10; }
        
        #result { display: none; margin-top: 20px; padding-top: 25px; border-top: 4px solid var(--amarelo); animation: slideUp 0.6s ease-out; }
        
        /* BILHETE PARA PRINT */
        .ticket-confirmacao {
            background: var(--gradiente-premio);
            border: 3px dashed var(--amarelo);
            border-radius: 30px;
            padding: 30px 20px;
            margin-bottom: 20px;
            color: white;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            text-align: center;
        }
        .ticket-confirmacao h2 { font-family: 'Dancing Script', cursive; color: var(--amarelo); font-size: 30px; margin: 0 0 10px 0; }
        .ticket-item { margin: 10px 0; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; }
        .ticket-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.8; }
        .ticket-value { font-size: 18px; font-weight: 800; display: block; color: #fff; }

        #campoIndicado { display: none; margin-top: 15px; }
        #nomeAmigo { padding: 12px; width: 85%; border-radius: 12px; border: none; text-align: center; font-weight: 700; outline: none; background: #fff; color: var(--azul-escuro); margin-top: 5px; }

        .wa-btn { display: inline-block; padding: 22px; background: #25d366; color: white; text-decoration: none; border-radius: 22px; font-weight: 800; width: 90%; text-transform: uppercase; font-size: 13px; box-shadow: 0 10px 25px rgba(37,211,102,0.4); }
        .print-hint { font-size: 13px; color: var(--azul-escuro); font-weight: 800; margin-bottom: 15px; background: var(--amarelo); padding: 10px; border-radius: 15px; }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="box">
    <div class="logo-container"><img src="NOSTÁLGICAS (1).png" alt="Logo Nostálgicas"></div>
    <p class="subtitle">Arte, Lembranças e amor</p>

    <div id="formInicial">
        <label>COMO PODEMOS TE CHAMAR?</label>
        <input type="text" id="nomeCliente" placeholder="Seu nome">
        <label>NÚMERO DO PEDIDO:</label>
        <input type="text" id="numPedido" placeholder="Digite o número...">
        <label>PRÓXIMO DESEJO:</label>
        <input type="text" id="proximoDesejo" placeholder="O que pretende comprar?">
        
        <div class="lgpd-container">
            <input type="checkbox" id="checkLGPD">
            <label for="checkLGPD">Autorizo o uso dos meus dados pela Nostálgicas conforme a LGPD.</label>
        </div>
        
        <button class="btn-main" onclick="validarForm()">LIBERAR MEU GIRO</button>
    </div>
    
    <div id="areaRoleta" style="display:none;">
        <div class="canvas-wrap"><div class="pointer"></div><canvas id="canvas" width="500" height="500"></canvas></div>
        <button id="spinBtn" class="btn-main" onclick="girar()">GIRAR AGORA!</button>
    </div>

    <div id="result">
        <div class="print-hint">📸 TIRE PRINT DESSE BILHETE AGORA!</div>
        
        <div class="ticket-confirmacao">
            <h2>Nostálgicas</h2>
            <div class="ticket-item">
                <span class="ticket-label">Ganhador(a):</span>
                <span class="ticket-value" id="tktNome">---</span>
            </div>
            <div class="ticket-item">
                <span class="ticket-label">Prêmio:</span>
                <span class="ticket-value" id="tktPremio">---</span>
            </div>
            <div id="campoIndicado">
                <span class="ticket-label">Amigo(a) Indicado(a):</span>
                <input type="text" id="nomeAmigo" placeholder="Nome de quem ganha 10%" oninput="atualizarLinkFinal()">
            </div>
        </div>

        <p style="font-size: 11px; margin-bottom: 10px;">Clique abaixo, selecione a <b>Nostálgicas</b> e o <b>Amigo</b> para enviar o print!</p>
        <a id="waLinkFinal" href="#" class="wa-btn" onclick="return verificarAcao(event)">COMPARTILHAR PRINT E BILHETE</a>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyD1zxy76BfS5Zc-6rjwK290fsq_cIFv9lrMvR7XQXqjs6YI5ph-wOgMBYoeXa0pCWLuQ/exec';
    const premiosData = [
        { name: "Cupom Indicação", chance: 45, color: "#faea60" },
        { name: "15% de Desconto", chance: 30, color: "#8c52ff" },
        { name: "R$ 10 OFF",       chance: 18, color: "#ffb11b" },
        { name: "Mini Álbum",      chance: 5,  color: "#300870" },
        { name: "Frete Grátis",    chance: 2,  color: "#fefefe" }
    ];

    let dadosGanhador = {};

    function draw() {
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const fatia = (2 * Math.PI) / 5;
        ctx.clearRect(0, 0, 500, 500);
        for (let i = 0; i < 5; i++) {
            ctx.save(); ctx.beginPath(); ctx.fillStyle = premiosData[i].color;
            ctx.moveTo(250, 250); ctx.arc(250, 250, 250, i * fatia - Math.PI/2, (i + 1) * fatia - Math.PI/2);
            ctx.fill(); ctx.stroke(); ctx.restore();
            ctx.save(); ctx.translate(250, 250); ctx.rotate(i * fatia + fatia / 2 - Math.PI / 2);
            ctx.fillStyle = (i === 1 || i === 3) ? "#fff" : "#300870"; 
            ctx.textAlign = "right"; ctx.font = "bold 22px Arial"; ctx.fillText(premiosData[i].name, 230, 8); ctx.restore();
        }
    }

    function validarForm() {
        if (document.getElementById("nomeCliente").value.length < 2) { alert("Digite seu nome!"); return; }
        if (!document.getElementById("checkLGPD").checked) { alert("Aceite os termos."); return; }
        document.getElementById("formInicial").style.display = "none";
        document.getElementById("areaRoleta").style.display = "block";
        draw();
    }

    function girar() {
        document.getElementById("spinBtn").disabled = true;
        const sorteadoIndex = Math.floor(Math.random() * 5); // Simplificado para o exemplo
        
        dadosGanhador = {
            nome: document.getElementById("nomeCliente").value,
            pedido: document.getElementById("numPedido").value,
            premio: premiosData[sorteadoIndex].name
        };

        document.getElementById("canvas").style.transform = `rotate(${3600 + (sorteadoIndex * -72)}deg)`;

        setTimeout(() => {
            confetti();
            exibirResultado();
        }, 5100);
    }

    function exibirResultado() {
        document.getElementById("areaRoleta").style.display = "none";
        document.getElementById("result").style.display = "block";
        document.getElementById("tktNome").innerText = dadosGanhador.nome;
        document.getElementById("tktPremio").innerText = dadosGanhador.premio;
        
        if (dadosGanhador.premio === "Cupom Indicação") document.getElementById("campoIndicado").style.display = "block";
        atualizarLinkFinal();
    }

    function atualizarLinkFinal() {
        const amigo = document.getElementById("nomeAmigo").value || "______";
        const btn = document.getElementById("waLinkFinal");
        
        // A MÁGICA: Usamos o link 'api.whatsapp.com/send?text=' SEM o número fixo do telefone.
        // Isso faz o WhatsApp abrir a lista de contatos para o usuário ESCOLHER para quem mandar.
        let texto = `🎁 *PRESENTE DA NOSTÁLGICAS!*\n\nEu ganhei na roleta e escolhi você para ganhar 10% de desconto também!\n\n👤 *Ganhador:* ${dadosGanhador.nome}\n🏆 *Prêmio:* ${dadosGanhador.premio}\n🎁 *Indicado:* ${amigo}\n\n📸 _(Estou enviando o print do meu bilhete em anexo)_`;
        
        btn.href = `https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`;
    }

    function verificarAcao(e) {
        if (dadosGanhador.premio === "Cupom Indicação" && !document.getElementById("nomeAmigo").value) {
            alert("Escreva o nome do amigo no bilhete antes de compartilhar!");
            return false;
        }

        // Salva na planilha silenciosamente
        fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(dadosGanhador) });
        
        return true; 
    }
</script>
</body>
</html>
